<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="description" content="Kalkulator Matematika Interaktif O'Cre">
    <title>Kalkulator Matematika - O'Cre</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <link rel="icon" href="icon.png" type="image/png">
    <style>
        :root {
            --bg-color: #0d1117;
            --card-bg: #161b22;
            --border-color: #30363d;
            --text-color: #e6edf3;
            --text-muted: #8b949e;
            --primary-color: #58a6ff;
            --hover-bg: #21262d;
            --heart-color: #ff7b72;
            --ad-tag-bg: #ee4d2d;
            --ad-tag-color: #ffffff;
        }

        body.light-theme {
            --bg-color: #f6f8fa;
            --card-bg: #ffffff;
            --border-color: #d0d7de;
            --text-color: #1f2328;
            --text-muted: #656d76;
            --primary-color: #0969da;
            --hover-bg: #f3f4f6;
        }

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            transition: background-color 0.3s ease, color 0.3s ease, border-color 0.3s ease;
        }

        body {
            background-color: var(--bg-color);
            color: var(--text-color);
            min-height: 100vh;
        }

        header {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 70px;
            background-color: var(--card-bg);
            border-bottom: 1px solid var(--border-color);
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0 4%;
            z-index: 1000;
        }

        .brand {
            font-size: 2rem;
            font-weight: 800;
            color: var(--primary-color);
            text-decoration: none;
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .search-container {
            display: flex;
            align-items: center;
            gap: 0.5rem;
            flex-grow: 1;
            max-width: 500px;
            margin: 0 1.5rem;
        }

        .category-select {
            background-color: var(--bg-color);
            color: var(--text-color);
            border: 1px solid var(--border-color);
            padding: 0.5rem 0.8rem;
            border-radius: 8px;
            outline: none;
            cursor: pointer;
            font-weight: 500;
        }

        .category-select:focus {
            border-color: var(--primary-color);
        }

        .search-box {
            position: relative;
            width: 100%;
        }

        .search-box input {
            width: 100%;
            padding: 0.5rem 1rem 0.5rem 2.3rem;
            background-color: var(--bg-color);
            border: 1px solid var(--border-color);
            border-radius: 8px;
            color: var(--text-color);
            outline: none;
        }

        .search-box input:focus {
            border-color: var(--primary-color);
        }

        .search-box i {
            position: absolute;
            left: 10px;
            top: 50%;
            transform: translateY(-50%);
            color: var(--text-muted);
        }

        .nav-menu {
            display: flex;
            align-items: center;
            list-style: none;
            gap: 0.5rem;
        }

        .theme-btn {
            background: none;
            border: 1px solid var(--border-color);
            color: var(--text-color);
            width: 38px;
            height: 38px;
            border-radius: 8px;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            font-size: 1.1rem;
        }

        .theme-btn:hover {
            background-color: var(--hover-bg);
            color: var(--primary-color);
        }

        main {
            margin-top: 85px;
            padding: 1.5rem 3%;
        }

        .grid-container {
            display: grid;
            grid-template-columns: repeat(6, 1fr);
            gap: 1rem;
        }

        .card {
            background-color: var(--card-bg);
            border: 1px solid var(--border-color);
            border-radius: 10px;
            overflow: hidden;
            cursor: pointer;
            transition: transform 0.2s, border-color 0.2s;
            display: flex;
            flex-direction: column;
            position: relative;
            text-decoration: none;
        }

        .card:hover {
            transform: translateY(-4px);
            border-color: var(--primary-color);
        }

        .card.ad-card:hover {
            border-color: #ee4d2d;
        }

        .card-img-wrapper {
            width: 100%;
            aspect-ratio: 16 / 10;
            background-color: var(--hover-bg);
            overflow: hidden;
        }

        .card-img-wrapper img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.3s;
        }

        .card:hover .card-img-wrapper img {
            transform: scale(1.05);
        }

        .card-content {
            padding: 0.6rem 0.8rem;
            display: flex;
            flex-direction: column;
            flex-grow: 1;
        }

        .card-meta {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 0.3rem;
        }

        .card-tag {
            font-size: 0.65rem;
            padding: 0.1rem 0.4rem;
            border-radius: 4px;
            background-color: var(--hover-bg);
            color: var(--primary-color);
            text-transform: uppercase;
            font-weight: bold;
        }

        .card-tag.ad-tag {
            background-color: var(--ad-tag-bg);
            color: var(--ad-tag-color);
        }

        .fav-btn {
            background: none;
            border: none;
            color: var(--text-muted);
            cursor: pointer;
            font-size: 1rem;
            padding: 2px 4px;
            transition: transform 0.2s, color 0.2s;
        }

        .fav-btn.active {
            color: var(--heart-color);
        }

        .fav-btn:hover {
            transform: scale(1.2);
        }

        .card-title {
            font-size: 0.85rem;
            font-weight: 600;
            color: var(--text-color);
            white-space: nowrap;
            overflow: hidden;
            text-overflow: ellipsis;
        }

        .card-sub {
            font-size: 0.7rem;
            color: var(--text-muted);
            margin-top: 0.1rem;
        }

        /* Modal Player Screen Fullscreen Overlay */
        .player-modal {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #0d1117;
            z-index: 2000;
            display: none;
        }

        .floating-controls {
            position: absolute;
            top: 15px;
            left: 20px;
            display: flex;
            gap: 12px;
            z-index: 2010;
        }

        .floating-btn {
            background: rgba(0, 0, 0, 0.3);
            border: none;
            color: rgba(255, 255, 255, 0.8);
            font-size: 1.4rem;
            cursor: pointer;
            width: 40px;
            height: 40px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.2s ease;
            backdrop-filter: blur(4px);
        }

        .floating-btn:hover {
            color: #58a6ff;
            background: rgba(0, 0, 0, 0.6);
            transform: scale(1.1);
        }

        .player-frame {
            width: 100%;
            height: 100%;
            border: none;
        }

        .empty-state {
            grid-column: 1 / -1;
            text-align: center;
            padding: 3rem;
            color: var(--text-muted);
            font-size: 1.1rem;
        }

        @media (max-width: 768px) {
            header {
                flex-wrap: wrap;
                height: auto;
                padding: 0.8rem 1rem;
                gap: 0.8rem;
            }
            .search-container {
                order: 3;
                max-width: 100%;
                margin: 0;
            }
            main {
                margin-top: 130px;
            }
            .grid-container {
                grid-template-columns: repeat(2, 1fr);
                gap: 0.8rem;
            }
        }
    </style>
</head>
<body>

    <header>
        <a href="#" class="brand" onclick="resetFilter(); return false;"><img src="icon.png" alt="Logo" height="40px"> Kalkulator Matematika</a>
        
        <div class="search-container">
            <select class="category-select" id="categorySelect" onchange="filterItems()">
                <option value="all">Semua</option>
                <option value="aplikasi">Aplikasi</option>
                <option value="favorite">❤️ Favorit Saya</option>
                <option value="afiliasi">Produk Afiliasi</option>
            </select>

            <div class="search-box">
                <i class="fa-solid fa-magnifying-glass"></i>
                <input type="text" id="searchInput" placeholder="Cari..." onkeyup="filterItems()">
            </div>
        </div>

        <ul class="nav-menu">
            <li><button class="theme-btn" id="themeToggle" onclick="toggleTheme()" title="Ganti Tema"><i class="fa-solid fa-sun"></i></button></li>
        </ul>
    </header>

    <main>
        <div class="grid-container" id="contentGrid"></div>
    </main>

    <!-- Modal Player Screen Fullscreen Overlay -->
    <div class="player-modal" id="playerModal">
        <div class="floating-controls">
            <button class="floating-btn" title="Toggle Fullscreen" onclick="toggleFullscreen()"><i class="fa-solid fa-expand" id="fullscreenIcon"></i></button>
            <!-- Tombol X di bawah ini hanya menutup Player Modal dan membawa kembali ke kalkulator-matematika.html -->
            <button class="floating-btn" title="Tutup" onclick="closePlayer()"><i class="fa-solid fa-xmark"></i></button>
        </div>
        <iframe class="player-frame" id="appIframe" src="" allow="fullscreen; autoplay; encrypted-media"></iframe>
    </div>

    <script>
        const itemsData = [
            { id: 'porogapit', title: 'Pembagian Porogapit', category: 'aplikasi', image: 'https://i.pinimg.com/736x/5a/06/8f/5a068fb4d5524dce1f4d7623b29fa778.jpg', url: 'https://gjls-bgt.github.io/pg/' },
            { id: 'bangun_datar', title: 'Bangun Datar', category: 'aplikasi', image: 'icon/bangun_datar.jpg', url: 'https://32hendiirawan.github.io/bangun-datar' },
            { id: 'bangun_ruang', title: 'Bangun Ruang', category: 'aplikasi', image: 'https://i.pinimg.com/736x/33/ef/4c/33ef4c51a1f9cc563d8ba8ca0b471cd5.jpg', url: 'https://32hendiirawan.github.io/bangun-ruang' },
            { id: 'trans-geo', title: 'Transformasi Geometri', category: 'aplikasi', image: 'icon/trans-geo.jpg', url: 'trans-geo.html' },
            { id: 'pecahan', title: 'Pecahan', category: 'aplikasi', image: 'https://i.pinimg.com/736x/6b/69/e6/6b69e63832baecf520bd2b64eadfd0d5.jpg', url: 'https://32hendiirawan.github.io/pecahan/' },
            { id: 'pemfaktoran', title: 'FPB & KPK', category: 'aplikasi', image: 'https://lh3.googleusercontent.com/d/1TX3lM3ctNlD1cpLIgHmhGrfHo0kBB2yv', url: 'https://32hendiirawan.github.io/pemfaktoran-fpb-kpk/' },
            { id: 'persamaan-kuadrat', title: 'Persamaan Kuadrat', category: 'aplikasi', image: 'icon/persamaan-kuadrat.jpg', url: 'persamaan-kuadrat.html' },
        ];

        const adsData = [
            { title: 'Atlas Geografi', store: 'Shopee', image: 'https://down-bs-id.img.susercontent.com/id-11134207-7r990-lovxt9mxd4el73.webp', url: 'https://s.shopee.co.id/7VFqHjma7L' },
            { title: 'Doa Harian Lengkap', store: 'Shopee', image: 'https://down-bs-id.img.susercontent.com/sg-11134201-7rdw8-mdd6gp7pk1toc8.webp', url: 'https://s.shopee.co.id/6VNJ66Xavn' },
            { title: 'Pen Gel Murah <1000', store: 'Shopee', image: 'https://down-bs-id.img.susercontent.com/id-11134207-7r98t-ly33ufvyzl0e5e.webp', url: 'https://s.shopee.co.id/6L3su4XPYp' },
            { title: 'Pensil Joyko 2B', store: 'Shopee', image: 'https://down-bs-id.img.susercontent.com/id-11134207-7rbk2-m901fue8d6hd0d.webp', url: 'https://s.shopee.co.id/2VrALB3COC' },
            { title: 'Gantungan Kunci Nama', store: 'Shopee', image: 'https://down-bs-id.img.susercontent.com/id-11134207-7ra0k-mb7fo8oh4vrt23.webp', url: 'https://s.shopee.co.id/6VNJ6n7hT0' },
            { title: 'Penghapus Pensil', store: 'Shopee', image: 'https://down-bs-id.img.susercontent.com/id-11134207-7rasg-m5wistuusaio15.webp', url: 'https://s.shopee.co.id/9AO4HssQU4' },
        ];

        let currentItem = null;
        let favorites = JSON.parse(localStorage.getItem('ocre_favorites')) || [];

        itemsData.sort((a, b) => a.title.localeCompare(b.title, 'id', { sensitivity: 'base' }));

        function toggleFavorite(event, id) {
            event.stopPropagation();
            if (favorites.includes(id)) {
                favorites = favorites.filter(favId => favId !== id);
            } else {
                favorites.push(id);
            }
            localStorage.setItem('ocre_favorites', JSON.stringify(favorites));
            filterItems();
        }

        function toggleTheme() {
            document.body.classList.toggle('light-theme');
            const isLight = document.body.classList.contains('light-theme');
            localStorage.setItem('ocre_theme', isLight ? 'light' : 'dark');
            
            const btnIcon = document.querySelector('#themeToggle i');
            btnIcon.className = isLight ? 'fa-solid fa-moon' : 'fa-solid fa-sun';
        }

        function loadTheme() {
            const savedTheme = localStorage.getItem('ocre_theme');
            if (savedTheme === 'light') {
                document.body.classList.add('light-theme');
                document.querySelector('#themeToggle i').className = 'fa-solid fa-moon';
            }
        }

        function getGridColumnsCount() {
            if (window.innerWidth <= 768) {
                return 2;
            }
            return 6;
        }

        function renderGrid(data) {
            const grid = document.getElementById('contentGrid');
            grid.innerHTML = '';
            
            if (data.length === 0) {
                grid.innerHTML = `<div class="empty-state">Tidak ada item yang ditemukan.</div>`;
                return;
            }

            const cols = getGridColumnsCount();
            const itemsPerRow = cols * 2;
            let adIndex = 0;

            function createAdCard(ad) {
                const adCard = document.createElement('a');
                adCard.className = 'card ad-card';
                adCard.href = ad.url;
                adCard.target = '_blank';
                adCard.rel = 'noopener noreferrer';

                adCard.innerHTML = `
                    <div class="card-img-wrapper">
                        <img src="${ad.image}" alt="${ad.title}" loading="lazy">
                    </div>
                    <div class="card-content">
                        <div class="card-meta">
                            <span class="card-tag ad-tag"><i class="fa-solid fa-bag-shopping"></i> Shopee</span>
                        </div>
                        <h3 class="card-title" title="${ad.title}">${ad.title}</h3>
                        <span class="card-sub">Produk Sponsor</span>
                    </div>
                `;
                return adCard;
            }

            data.forEach((item, index) => {
                const card = document.createElement('div');
                
                if (item.category === 'afiliasi') {
                    const adCard = document.createElement('a');
                    adCard.className = 'card ad-card';
                    adCard.href = item.url;
                    adCard.target = '_blank';
                    adCard.rel = 'noopener noreferrer';

                    adCard.innerHTML = `
                        <div class="card-img-wrapper">
                            <img src="${item.image}" alt="${item.title}" loading="lazy">
                        </div>
                        <div class="card-content">
                            <div class="card-meta">
                                <span class="card-tag ad-tag"><i class="fa-solid fa-bag-shopping"></i> Shopee</span>
                            </div>
                            <h3 class="card-title" title="${item.title}">${item.title}</h3>
                            <span class="card-sub">Produk Sponsor</span>
                        </div>
                    `;
                    grid.appendChild(adCard);
                } else {
                    card.className = 'card';
                    card.onclick = () => openPlayer(item);
                    const isFav = favorites.includes(item.id);

                    card.innerHTML = `
                        <div class="card-img-wrapper">
                            <img src="${item.image}" alt="${item.title}" loading="lazy">
                        </div>
                        <div class="card-content">
                            <div class="card-meta">
                                <span class="card-tag">${item.category}</span>
                                <button class="fav-btn ${isFav ? 'active' : ''}" onclick="toggleFavorite(event, '${item.id}')" title="Simpan Favorit">
                                    <i class="${isFav ? 'fa-solid' : 'fa-regular'} fa-heart"></i>
                                </button>
                            </div>
                            <h3 class="card-title" title="${item.title}">${item.title}</h3>
                        </div>
                    `;
                    grid.appendChild(card);
                }

                if ((index + 1) % itemsPerRow === 0 && (index + 1) < data.length) {
                    for (let i = 0; i < cols; i++) {
                        const ad = adsData[adIndex % adsData.length];
                        adIndex++;
                        grid.appendChild(createAdCard(ad));
                    }
                }
            });

            if (data.length <= itemsPerRow) {
                for (let i = 0; i < cols; i++) {
                    const ad = adsData[adIndex % adsData.length];
                    adIndex++;
                    grid.appendChild(createAdCard(ad));
                }
            }
        }

        function filterItems() {
            const category = document.getElementById('categorySelect').value;
            const query = document.getElementById('searchInput').value.toLowerCase();

            const convertedAds = adsData.map((ad, idx) => ({
                id: 'ad-' + idx,
                title: ad.title,
                category: 'afiliasi',
                image: ad.image,
                url: ad.url
            }));

            const allCombinedItems = [...itemsData, ...convertedAds];

            const filtered = allCombinedItems.filter(item => {
                let matchesCat = false;
                if (category === 'all') {
                    matchesCat = true;
                } else if (category === 'favorite') {
                    matchesCat = favorites.includes(item.id);
                } else {
                    matchesCat = (item.category === category);
                }

                const matchesQuery = item.title.toLowerCase().includes(query);
                return matchesCat && matchesQuery;
            });

            renderGrid(filtered);
        }

        function resetFilter() {
            document.getElementById('categorySelect').value = 'all';
            document.getElementById('searchInput').value = '';
            renderGrid(itemsData);
            closePlayer();
        }

        function openPlayer(item) {
            currentItem = item;
            document.getElementById('appIframe').src = item.url;
            document.getElementById('playerModal').style.display = 'block';
            window.location.hash = item.id;
        }

        // Fungsi closePlayer() hanya menutup playerModal dan mengosongkan iframe,
        // sehingga user tetap berada di halaman kalkulator-matematika.html.
        function closePlayer() {
            if (document.fullscreenElement) {
                document.exitFullscreen().catch(err => console.log(err));
            }
            document.getElementById('playerModal').style.display = 'none';
            document.getElementById('appIframe').src = '';
            currentItem = null;
            
            if (window.location.hash) {
                history.pushState("", document.title, window.location.pathname + window.location.search);
            }
        }

        function toggleFullscreen() {
            const modal = document.getElementById('playerModal');
            const icon = document.getElementById('fullscreenIcon');
            
            if (!document.fullscreenElement) {
                modal.requestFullscreen().then(() => {
                    icon.classList.remove('fa-expand');
                    icon.classList.add('fa-compress');
                }).catch(err => {
                    console.log(`Gagal masuk mode fullscreen: ${err.message}`);
                });
            } else {
                document.exitFullscreen().then(() => {
                    icon.classList.remove('fa-compress');
                    icon.classList.add('fa-expand');
                });
            }
        }

        document.addEventListener('fullscreenchange', () => {
            const icon = document.getElementById('fullscreenIcon');
            if (icon) {
                if (document.fullscreenElement) {
                    icon.classList.remove('fa-expand');
                    icon.classList.add('fa-compress');
                } else {
                    icon.classList.remove('fa-compress');
                    icon.classList.add('fa-expand');
                }
            }
        });

        function checkUrlHash() {
            const hash = decodeURIComponent(window.location.hash.replace('#', ''));
            if (hash) {
                const item = itemsData.find(i => i.id === hash);
                if (item) {
                    openPlayer(item);
                }
            } else {
                closePlayer();
            }
        }

        window.addEventListener('hashchange', checkUrlHash);
        window.addEventListener('resize', () => { filterItems(); });

        loadTheme();
        renderGrid(itemsData);
        checkUrlHash();

        (function() {
            window.addEventListener('contextmenu', e => { e.preventDefault(); e.stopPropagation(); }, true);
            window.addEventListener('keydown', function(e) {
                if (e.key === 'F12') { e.preventDefault(); e.stopPropagation(); }
                if (e.ctrlKey && e.shiftKey && ['I', 'J', 'C'].includes(e.key.toUpperCase())) { e.preventDefault(); e.stopPropagation(); }
                if (e.ctrlKey && ['U', 'S', 'A', 'C'].includes(e.key.toUpperCase())) { e.preventDefault(); e.stopPropagation(); }
            }, true);
        })();
    </script>
</body>
</html>
