<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Tabel Periodik Unsur Kimia Lengkap</title>
<style>
@import url('https://fonts.googleapis.com/css2?family=Google+Sans+Flex:ital,wght@0,300..700;1,300..700&family=Google+Sans+Code:ital,wght,MONO@0,300..700,0..1;1,300..700,0..1&display=swap');

:root {
  --bg-color: #f8fafc;
  --surface-color: #ffffff;
  --surface-dim: #f1f5f9;
  --text-color: #0f172a;
  --text-sub: #64748b;
  --border-color: #cbd5e1;
  
  --cat-nonmetal: #e0f2fe;
  --cat-nonmetal-text: #0369a1;
  --cat-noble: #f3e8ff;
  --cat-noble-text: #6b21a8;
  --cat-alkali: #ffe4e6;
  --cat-alkali-text: #9f1239;
  --cat-alkaline: #ffedd5;
  --cat-alkaline-text: #9a3412;
  --cat-metalloid: #fef9c3;
  --cat-metalloid-text: #854d0e;
  --cat-halogen: #ccfbf1;
  --cat-halogen-text: #115e59;
  --cat-transition: #e0e7ff;
  --cat-transition-text: #3730a3;
  --cat-post-transition: #dcfce7;
  --cat-post-transition-text: #166534;
  --cat-lanthanide: #fce7f3;
  --cat-lanthanide-text: #9d174d;
  --cat-actinide: #ffe4e6;
  --cat-actinide-text: #881337;
}

[data-theme="dark"] {
  --bg-color: #0f172a;
  --surface-color: #1e293b;
  --surface-dim: #0f172a;
  --text-color: #f8fafc;
  --text-sub: #94a3b8;
  --border-color: #334155;

  --cat-nonmetal: #1e3a8a;
  --cat-nonmetal-text: #bfdbfe;
  --cat-noble: #581c87;
  --cat-noble-text: #e9d5ff;
  --cat-alkali: #881337;
  --cat-alkali-text: #fecdd3;
  --cat-alkaline: #7c2d12;
  --cat-alkaline-text: #ffedd5;
  --cat-metalloid: #713f12;
  --cat-metalloid-text: #fef08a;
  --cat-halogen: #134e4a;
  --cat-halogen-text: #99f6e4;
  --cat-transition: #312e81;
  --cat-transition-text: #c7d2fe;
  --cat-post-transition: #14532d;
  --cat-post-transition-text: #bbf7d0;
  --cat-lanthanide: #831843;
  --cat-lanthanide-text: #fbcfe8;
  --cat-actinide: #4c0519;
  --cat-actinide-text: #fecdd3;
}

* { box-sizing: border-box; }
body {
  margin: 0;
  padding: 16px;
  background-color: var(--bg-color);
  color: var(--text-color);
  font-family: 'Google Sans Flex', sans-serif;
}

.header-bar {
  display: flex;
  justify-content: space-between;
  align-items: center;
  margin-bottom: 16px;
  gap: 16px;
  flex-wrap: wrap;
}

.header-bar h1 {
  margin: 0;
  font-size: 22px;
}

.controls {
  display: flex;
  gap: 10px;
  align-items: center;
}

.controls input, .controls select {
  padding: 8px 12px;
  border-radius: 8px;
  border: 1px solid var(--border-color);
  background: var(--surface-color);
  color: var(--text-color);
  outline: none;
}

.theme-toggle {
  padding: 8px 12px;
  border-radius: 8px;
  border: 1px solid var(--border-color);
  background: var(--surface-color);
  color: var(--text-color);
  cursor: pointer;
}

.main-layout {
  display: flex;
  gap: 16px;
  align-items: flex-start;
}

/* SIDEBAR KIRI INFORMASI UNSUR */
aside.info-sidebar {
  width: 280px;
  flex-shrink: 0;
  background: var(--surface-color);
  border: 1px solid var(--border-color);
  border-radius: 12px;
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 12px;
  box-shadow: 0 4px 6px -1px rgba(0, 0, 0, 0.05);
}

.sidebar-header {
  display: flex;
  align-items: center;
  gap: 12px;
  border-bottom: 1px solid var(--border-color);
  padding-bottom: 12px;
}

.big-symbol {
  font-size: 36px;
  font-weight: 800;
  line-height: 1;
}

.big-title {
  display: flex;
  flex-direction: column;
}

.big-title .num { font-size: 11px; color: var(--text-sub); font-family: 'Google Sans Code', monospace; }
.big-title .name { font-size: 16px; font-weight: 700; }
.big-title .latin { font-size: 12px; font-style: italic; color: var(--text-sub); }

.info-list {
  display: flex;
  flex-direction: column;
  gap: 8px;
  font-size: 13px;
}

.info-row {
  display: flex;
  justify-content: space-between;
  align-items: center;
  padding: 4px 0;
  border-bottom: 1px dashed var(--border-color);
}

.info-row:last-child { border-bottom: none; }
.info-label { color: var(--text-sub); }
.info-value { font-weight: 600; font-family: 'Google Sans Code', monospace; text-align: right; }

/* BOHR MODEL CANVAS */
.bohr-container {
  display: flex;
  flex-direction: column;
  align-items: center;
  margin-top: 8px;
}

.bohr-title { font-size: 11px; color: var(--text-sub); margin-bottom: 4px; }

/* TABEL PERIODIK & LEGEND */
.right-content {
  flex-grow: 1;
  display: flex;
  flex-direction: column;
  gap: 12px;
  overflow-x: auto;
}

.legend-bar {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  background: var(--surface-color);
  border: 1px solid var(--border-color);
  padding: 10px;
  border-radius: 8px;
}

.legend-item {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 11px;
  padding: 2px 6px;
  border-radius: 4px;
  cursor: pointer;
}

.legend-color {
  width: 10px;
  height: 10px;
  border-radius: 2px;
}

.periodic-table {
  display: grid;
  grid-template-columns: repeat(18, minmax(52px, 1fr));
  gap: 4px;
  min-width: 960px;
}

.element-cell {
  aspect-ratio: 1;
  border-radius: 6px;
  padding: 3px;
  display: flex;
  flex-direction: column;
  justify-content: space-between;
  cursor: pointer;
  user-select: none;
  transition: transform 0.1s, box-shadow 0.1s;
  border: 1px solid transparent;
}

.element-cell:hover {
  transform: scale(1.08);
  box-shadow: 0 4px 10px rgba(0,0,0,0.15);
  z-index: 5;
}

.element-cell.selected {
  outline: 2px solid var(--text-color);
}

.element-cell.dimmed { opacity: 0.25; }

.element-cell.placeholder {
  border: 1px dashed var(--border-color);
  background: transparent !important;
  cursor: default;
}

.element-num { font-size: 9px; font-family: 'Google Sans Code', monospace; opacity: 0.8; }
.element-symbol { font-size: 14px; font-weight: 700; text-align: center; line-height: 1; }
.element-name { font-size: 8px; text-align: center; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }

.cat-nonmetal { background-color: var(--cat-nonmetal); color: var(--cat-nonmetal-text); }
.cat-noble { background-color: var(--cat-noble); color: var(--cat-noble-text); }
.cat-alkali { background-color: var(--cat-alkali); color: var(--cat-alkali-text); }
.cat-alkaline { background-color: var(--cat-alkaline); color: var(--cat-alkaline-text); }
.cat-metalloid { background-color: var(--cat-metalloid); color: var(--cat-metalloid-text); }
.cat-halogen { background-color: var(--cat-halogen); color: var(--cat-halogen-text); }
.cat-transition { background-color: var(--cat-transition); color: var(--cat-transition-text); }
.cat-post-transition { background-color: var(--cat-post-transition); color: var(--cat-post-transition-text); }
.cat-lanthanide { background-color: var(--cat-lanthanide); color: var(--cat-lanthanide-text); }
.cat-actinide { background-color: var(--cat-actinide); color: var(--cat-actinide-text); }

.gap-row { grid-column: span 18; height: 12px; }
</style>

</div>

const categoryLabels = {
  'nonmetal': 'Nonlogam Reaktif',
  'noble': 'Gas Mulia',
  'alkali': 'Logam Alkali',
  'alkaline': 'Alkali Tanah',
  'metalloid': 'Metaloid',
  'halogen': 'Halogen',
  'transition': 'Logam Transisi',
  'post-transition': 'Logam Pasca-Transisi',
  'lanthanide': 'Lantanida',
  'actinide': 'Aktinida'
};

const tableEl = document.getElementById('periodicTable');
const legendBar = document.getElementById('legendBar');
const searchInput = document.getElementById('searchInput');
const filterSelect = document.getElementById('filterSelect');
const themeToggle = document.getElementById('themeToggle');

let currentSelectedSym = "O";

function initTable() {
  const grid = Array(9).fill(null).map(() => Array(18).fill(null));
  elements.forEach(el => { grid[el.row - 1][el.col - 1] = el; });

  tableEl.innerHTML = '';

  for (let r = 0; r < 7; r++) {
    for (let c = 0; c < 18; c++) {
      const item = grid[r][c];
      if (item) {
        tableEl.appendChild(createElementCell(item));
      } else if (r === 5 && c === 2) {
        tableEl.appendChild(createPlaceholderCell("57-71", "La-Lu", "lanthanide"));
      } else if (r === 6 && c === 2) {
        tableEl.appendChild(createPlaceholderCell("89-103", "Ac-Lr", "actinide"));
      } else {
        tableEl.appendChild(document.createElement('div'));
      }
    }
  }

  const gap = document.createElement('div');
  gap.className = 'gap-row';
  tableEl.appendChild(gap);

  for (let r = 7; r < 9; r++) {
    for (let c = 0; c < 18; c++) {
      const item = grid[r][c];
      if (item) {
        tableEl.appendChild(createElementCell(item));
      } else {
        tableEl.appendChild(document.createElement('div'));
      }
    }
  }

  initLegend();
  updateSidebar(elements.find(e => e.sym === "O"));
}

function createElementCell(el) {
  const cell = document.createElement('div');
  cell.className = `element-cell cat-${el.cat} ${el.sym === currentSelectedSym ? 'selected' : ''}`;
  cell.dataset.symbol = el.sym.toLowerCase();
  cell.dataset.name = el.name.toLowerCase();
  cell.dataset.num = el.num;
  cell.dataset.cat = el.cat;

  cell.innerHTML = `
    <span class="element-num">${el.num}</span>
    <span class="element-symbol">${el.sym}</span>
    <span class="element-name">${el.name}</span>
  `;

  cell.addEventListener('click', () => {
    document.querySelectorAll('.element-cell').forEach(c => c.classList.remove('selected'));
    cell.classList.add('selected');
    currentSelectedSym = el.sym;
    updateSidebar(el);
  });

  return cell;
}

function createPlaceholderCell(numText, symText, cat) {
  const cell = document.createElement('div');
  cell.className = `element-cell placeholder cat-${cat}`;
  cell.innerHTML = `
    <span class="element-num">${numText}</span>
    <span class="element-symbol" style="font-size: 11px;">${symText}</span>
    <span></span>
  `;
  return cell;
}

function initLegend() {
  legendBar.innerHTML = '';
  Object.keys(categoryLabels).forEach(cat => {
    const item = document.createElement('div');
    item.className = 'legend-item';
    item.innerHTML = `
      <div class="legend-color cat-${cat}"></div>
      <span>${categoryLabels[cat]}</span>
    `;
    item.addEventListener('click', () => {
      filterSelect.value = filterSelect.value === cat ? 'all' : cat;
      filterElements();
    });
    legendBar.appendChild(item);
  });
}

function updateSidebar(el) {
  document.getElementById('sideSym').textContent = el.sym;
  document.getElementById('sideNum').textContent = `Nomor Atom : ${el.num}`;
  document.getElementById('sideName').textContent = el.name;
  document.getElementById('sideLatin').textContent = el.latin;
  document.getElementById('sideCat').textContent = categoryLabels[el.cat];
  document.getElementById('sideMass').textContent = el.mass + (el.mass.startsWith('(') ? '' : ' u');
  document.getElementById('sideConfig').textContent = el.config;
  document.getElementById('sideSubshell').textContent = el.subshell;
  document.getElementById('sidePerGol').textContent = `${el.row > 7 ? (el.row === 8 ? 6 : 7) : el.row} / ${el.col}`;
  document.getElementById('sidePhase').textContent = el.phase;
  document.getElementById('sideMelt').textContent = el.melt;
  document.getElementById('sideBoil').textContent = el.boil;
  document.getElementById('sideValence').textContent = el.valence;

  drawBohrModel(el.shells || [2, 6]);
}

function drawBohrModel(shells) {
  const canvas = document.getElementById('bohrCanvas');
  const ctx = canvas.getContext('2d');
  const cx = canvas.width / 2;
  const cy = canvas.height / 2;

  ctx.clearRect(0, 0, canvas.width, canvas.height);

  // Inti Atom
  ctx.beginPath();
  ctx.arc(cx, cy, 14, 0, Math.PI * 2);
  ctx.fillStyle = '#3b82f6';
  ctx.fill();
  ctx.fillStyle = '#ffffff';
  ctx.font = 'bold 10px sans-serif';
  ctx.textAlign = 'center';
  ctx.textBaseline = 'middle';
  ctx.fillText(document.getElementById('sideSym').textContent, cx, cy);

  // Orbit Kulit & Elektron
  const maxRadius = 75;
  const step = maxRadius / (shells.length || 1);

  shells.forEach((count, i) => {
    const r = 24 + (i * step);

    // Garis Orbit
    ctx.beginPath();
    ctx.arc(cx, cy, r, 0, Math.PI * 2);
    ctx.strokeStyle = 'rgba(100, 116, 139, 0.4)';
    ctx.lineWidth = 1;
    ctx.stroke();

    // Elektron
    for (let e = 0; e < count; e++) {
      const angle = (e * (2 * Math.PI / count)) - (Math.PI / 2);
      const ex = cx + r * Math.cos(angle);
      const ey = cy + r * Math.sin(angle);

      ctx.beginPath();
      ctx.arc(ex, ey, 4, 0, Math.PI * 2);
      ctx.fillStyle = '#0284c7';
      ctx.fill();
    }
  });
}

function filterElements() {
  const query = searchInput.value.toLowerCase().trim();
  const catFilter = filterSelect.value;

  document.querySelectorAll('.element-cell').forEach(cell => {
    if (cell.classList.contains('placeholder')) return;
    const name = cell.dataset.name || '';
    const sym = cell.dataset.symbol || '';
    const num = cell.dataset.num || '';
    const cat = cell.dataset.cat || '';

    const matchesSearch = !query || name.includes(query) || sym.includes(query) || num.includes(query);
    const matchesCat = catFilter === 'all' || cat === catFilter;

    if (matchesSearch && matchesCat) {
      cell.classList.remove('dimmed');
    } else {
      cell.classList.add('dimmed');
    }
  });
}

themeToggle.addEventListener('click', () => {
  const isDark = document.documentElement.getAttribute('data-theme') === 'dark';
  if (isDark) {
    document.documentElement.removeAttribute('data-theme');
    themeToggle.textContent = '🌙 Mode';
  } else {
    document.documentElement.setAttribute('data-theme', 'dark');
    themeToggle.textContent = '☀️ Mode';
  }
});

searchInput.addEventListener('input', filterElements);
filterSelect.addEventListener('change', filterElements);

initTable();
</script>
