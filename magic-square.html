<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Magic Square</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Canvas Confetti CDN -->
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    
    <style>
        @import url('https://fonts.googleapis.com/css2?family=Fredoka:wght@400;500;600;700&family=Outfit:wght@400;600;800&display=swap');

        * {
            box-sizing: border-box;
            user-select: none;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            font-family: 'Fredoka', sans-serif;
            background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #0f172a 100%);
            color: #f8fafc;
            touch-action: manipulation;
        }

        .font-outfit {
            font-family: 'Outfit', sans-serif;
        }

        /* Glassmorphism containers */
        .glass-panel {
            background: rgba(30, 41, 59, 0.7);
            backdrop-filter: blur(12px);
            -webkit-backdrop-filter: blur(12px);
            border: 1px solid rgba(255, 255, 255, 0.1);
        }

        /* Input Sel Angka Isian (Kontras & Berbeda) */
        .cell-input {
            background: linear-gradient(145deg, #1e293b, #0f172a);
            border: 2px solid #38bdf8;
            box-shadow: 0 0 10px rgba(56, 189, 248, 0.25), inset 0 2px 4px rgba(0,0,0,0.5);
            color: #38bdf8;
            font-weight: 700;
            transition: all 0.2s ease;
            text-align: center;
        }

        .cell-input:focus {
            outline: none;
            border-color: #f59e0b;
            box-shadow: 0 0 15px rgba(245, 158, 11, 0.6), inset 0 2px 4px rgba(0,0,0,0.5);
            color: #fbbf24;
            background: #0284c7;
            transform: scale(1.03);
            z-index: 20;
        }

        .cell-input.filled {
            background: linear-gradient(145deg, #0284c7, #0369a1);
            color: #ffffff;
            border-color: #38bdf8;
        }

        /* State Validasi Khusus */
        .cell-input.duplicate {
            background: linear-gradient(145deg, #991b1b, #7f1d1d) !important;
            border-color: #ef4444 !important;
            color: #fca5a5 !important;
            animation: shake 0.4s ease-in-out;
            box-shadow: 0 0 12px rgba(239, 68, 68, 0.8) !important;
        }

        .cell-input.exceeded {
            background: linear-gradient(145deg, #831843, #701a75) !important;
            border-color: #f43f5e !important;
            color: #fda4af !important;
            animation: pulse-red 1s infinite alternate;
            box-shadow: 0 0 12px rgba(244, 63, 94, 0.8) !important;
        }

        /* Label Header / Indikator Penjumlahan */
        .cell-label {
            background: rgba(15, 23, 42, 0.6);
            border: 1px solid rgba(255, 255, 255, 0.08);
            color: #94a3b8;
            font-size: 0.75rem;
            font-weight: 600;
        }

        .cell-sum {
            font-weight: 700;
            border: 1px solid rgba(255, 255, 255, 0.15);
            transition: all 0.3s ease;
            box-shadow: inset 0 1px 2px rgba(0,0,0,0.3);
        }

        .sum-neutral {
            background: rgba(30, 41, 59, 0.8);
            color: #94a3b8;
            border-color: rgba(148, 163, 184, 0.2);
        }

        .sum-correct {
            background: linear-gradient(145deg, #15803d, #166534);
            color: #86efac;
            border-color: #22c55e;
            box-shadow: 0 0 8px rgba(34, 197, 94, 0.4);
        }

        .sum-wrong {
            background: linear-gradient(145deg, #991b1b, #7f1d1d);
            color: #fca5a5;
            border-color: #ef4444;
            box-shadow: 0 0 8px rgba(239, 68, 68, 0.4);
        }

        /* Custom Scrollbar Removal & Input Chrome Fix */
        input[type=number]::-webkit-inner-spin-button, 
        input[type=number]::-webkit-outer-spin-button { 
            -webkit-appearance: none; 
            margin: 0; 
        }
        input[type=number] {
            -moz-appearance: textfield;
        }

        @keyframes shake {
            0%, 100% { transform: translateX(0); }
            20%, 60% { transform: translateX(-4px); }
            40%, 80% { transform: translateX(4px); }
        }

        @keyframes pulse-red {
            0% { border-color: #f43f5e; box-shadow: 0 0 5px #f43f5e; }
            100% { border-color: #e11d48; box-shadow: 0 0 15px #e11d48; }
        }
    </style>
</head>
<body class="h-screen w-screen overflow-hidden flex flex-col justify-between items-center p-2 sm:p-4">

    <!-- Header & Status Bar -->
    <header class="w-full max-w-lg flex flex-col gap-2 shrink-0">
        <!-- Title & Sound Toggle -->
        <div class="flex justify-between items-center px-1">
            <div class="flex items-center gap-2">
                <i class="fa-solid font-outfit fa-shapes text-amber-400 text-2xl"></i>
                <h1 class="text-xl sm:text-2xl font-bold tracking-wide bg-gradient-to-r from-amber-300 via-orange-400 to-amber-500 bg-clip-text text-transparent">
                    MAGIC SQUARE
                </h1>
            </div>
            <button id="soundToggleBtn" onclick="toggleSound()" class="glass-panel w-9 h-9 rounded-full flex items-center justify-center text-slate-300 hover:text-white transition">
                <i id="soundIcon" class="fa-solid fa-volume-high text-sm"></i>
            </button>
        </div>

        <!-- Controls: Select Level & Info Badges -->
        <div class="glass-panel p-2 rounded-2xl flex items-center justify-between gap-2 text-xs sm:text-sm">
            <!-- Level Dropdown -->
            <div class="flex items-center gap-1.5 bg-slate-900/80 px-2.5 py-1.5 rounded-xl border border-slate-700/60">
                <span class="text-slate-400 font-medium">Ukuran:</span>
                <select id="levelSelect" onchange="changeLevel(this.value)" class="bg-transparent text-amber-400 font-bold focus:outline-none cursor-pointer">
                    <option value="3" class="bg-slate-800 text-white">3 x 3</option>
                    <option value="4" class="bg-slate-800 text-white">4 x 4</option>
                    <option value="5" class="bg-slate-800 text-white">5 x 5</option>
                    <option value="6" class="bg-slate-800 text-white">6 x 6</option>
                    <option value="7" class="bg-slate-800 text-white">7 x 7</option>
                </select>
            </div>

            <!-- Target Sum Badge -->
            <div class="flex items-center gap-1 bg-amber-500/10 px-2.5 py-1.5 rounded-xl border border-amber-500/30 text-amber-300">
                <span>Target:</span>
                <strong id="targetSumDisplay" class="font-outfit text-sm sm:text-base font-extrabold">15</strong>
            </div>

            <!-- Timer -->
            <div class="flex items-center gap-1.5 bg-slate-900/80 px-2.5 py-1.5 rounded-xl border border-slate-700/60 text-slate-300 font-outfit">
                <i class="fa-regular fa-clock text-amber-400"></i>
                <span id="timerDisplay" class="font-bold">00:00</span>
            </div>
        </div>
    </header>

    <!-- Main Game Board Container -->
    <main class="w-full max-w-lg flex-1 flex flex-col justify-center items-center my-1 relative overflow-hidden">
        <!-- Error / Warning Banner -->
        <div id="warningBanner" class="hidden absolute top-0 z-30 bg-rose-600/90 text-white text-xs px-3 py-1 rounded-full shadow-lg border border-rose-400 animate-bounce flex items-center gap-1">
            <i class="fa-solid fa-triangle-exclamation"></i>
            <span id="warningText">Ada angka duplikat!</span>
        </div>

        <!-- Dynamic Grid Viewport (Scaled automatically to fit screen without scrolling) -->
        <div id="gridContainer" class="w-full flex items-center justify-center p-1 sm:p-2">
            <!-- Grid HTML injected via JS -->
        </div>
    </main>

    <!-- Action Buttons Footer -->
    <footer class="w-full max-w-lg flex flex-col gap-2 shrink-0">
        <!-- Action Buttons -->
        <div class="grid grid-cols-2 gap-3">
            <!-- Reset Button -->
            <button onclick="resetGame()" class="glass-panel py-2.5 px-4 rounded-xl font-bold text-slate-200 hover:text-white hover:bg-slate-800/80 active:scale-95 transition flex items-center justify-center gap-2 border border-slate-700">
                <i class="fa-solid fa-rotate-left text-amber-400"></i>
                <span>Ulangi</span>
            </button>

            <!-- Hint Button (Max 3x) -->
            <button id="hintBtn" onclick="giveHint()" class="glass-panel py-2.5 px-4 rounded-xl font-bold text-amber-300 hover:bg-amber-500/10 active:scale-95 transition flex items-center justify-center gap-2 border border-amber-500/30 relative">
                <i class="fa-solid fa-lightbulb text-amber-400"></i>
                <span>Petunjuk</span>
                <span id="hintBadge" class="absolute -top-2 -right-1 bg-amber-500 text-slate-950 font-extrabold text-[10px] px-2 py-0.5 rounded-full border border-slate-900 shadow">
                    3/3
                </span>
            </button>
        </div>

        <!-- Range & Guide Info -->
        <div class="text-center text-[11px] text-slate-400">
            Isikan angka <span id="rangeDisplay" class="text-amber-400 font-bold">1 - 9</span>. Semua baris, kolom & diagonal harus berjumlah <span id="targetSumFooter" class="text-amber-400 font-bold">15</span>.
        </div>
    </footer>

    <!-- Win Modal Popup -->
    <div id="winModal" class="hidden fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-md flex items-center justify-center p-4">
        <div class="glass-panel p-6 rounded-3xl max-w-sm w-full text-center flex flex-col items-center gap-4 border border-amber-500/40 shadow-2xl animate-scaleIn">
            <div class="w-16 h-16 bg-gradient-to-tr from-amber-500 to-orange-400 rounded-2xl flex items-center justify-center text-slate-950 text-3xl shadow-lg shadow-amber-500/30">
                <i class="fa-solid fa-trophy"></i>
            </div>
            
            <div>
                <h2 class="text-2xl font-black text-amber-300 font-outfit">SELESAI!</h2>
                <p class="text-slate-300 text-xs mt-1">Luar biasa! Anda berhasil memecahkan Persegi Ajaib ini.</p>
            </div>

            <div class="w-full bg-slate-900/80 p-3 rounded-xl border border-slate-800 grid grid-cols-2 gap-2 text-xs">
                <div>
                    <span class="text-slate-400 block">Waktu</span>
                    <strong id="finalTime" class="text-amber-400 font-outfit text-sm">00:00</strong>
                </div>
                <div>
                    <span class="text-slate-400 block">Ukuran</span>
                    <strong id="finalLevel" class="text-amber-400 font-outfit text-sm">3x3</strong>
                </div>
            </div>

            <button onclick="closeWinModal(); resetGame();" class="w-full py-3 bg-gradient-to-r from-amber-500 to-orange-500 hover:from-amber-400 hover:to-orange-400 text-slate-950 font-black rounded-xl shadow-lg transition active:scale-95">
                Main Lagi
            </button>
        </div>
    </div>

    <!-- JavaScript Logic -->
    <script>
        // --- State Variables ---
        let N = 3;
        let targetSum = 15;
        let maxNum = 9;
        let userGrid = [];
        let solutionGrid = [];
        let hintCount = 3;
        const MAX_HINTS = 3;

        let timerInterval = null;
        let secondsElapsed = 0;
        let soundEnabled = true;

        // --- Sound Web Audio API Synthesizer ---
        const AudioCtx = window.AudioContext || window.webkitAudioContext;
        let audioCtx = null;

        function playSound(type) {
            if (!soundEnabled) return;
            try {
                if (!audioCtx) audioCtx = new AudioCtx();
                if (audioCtx.state === 'suspended') audioCtx.resume();

                const osc = audioCtx.createOscillator();
                const gain = audioCtx.createGain();
                osc.connect(gain);
                gain.connect(audioCtx.destination);

                const now = audioCtx.currentTime;

                if (type === 'type') {
                    osc.type = 'sine';
                    osc.frequency.setValueAtTime(400, now);
                    osc.frequency.exponentialRampToValueAtTime(800, now + 0.08);
                    gain.gain.setValueAtTime(0.15, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.08);
                    osc.start(now);
                    osc.stop(now + 0.08);
                } else if (type === 'error') {
                    osc.type = 'sawtooth';
                    osc.frequency.setValueAtTime(180, now);
                    osc.frequency.linearRampToValueAtTime(110, now + 0.15);
                    gain.gain.setValueAtTime(0.2, now);
                    gain.gain.linearRampToValueAtTime(0.01, now + 0.15);
                    osc.start(now);
                    osc.stop(now + 0.15);
                } else if (type === 'win') {
                    const notes = [523.25, 659.25, 783.99, 1046.50];
                    notes.forEach((freq, idx) => {
                        const subOsc = audioCtx.createOscillator();
                        const subGain = audioCtx.createGain();
                        subOsc.connect(subGain);
                        subGain.connect(audioCtx.destination);
                        subOsc.frequency.setValueAtTime(freq, now + idx * 0.1);
                        subGain.gain.setValueAtTime(0.2, now + idx * 0.1);
                        subGain.gain.linearRampToValueAtTime(0.01, now + idx * 0.1 + 0.25);
                        subOsc.start(now + idx * 0.1);
                        subOsc.stop(now + idx * 0.1 + 0.25);
                    });
                }
            } catch(e) {}
        }

        function toggleSound() {
            soundEnabled = !soundEnabled;
            const icon = document.getElementById('soundIcon');
            icon.className = soundEnabled ? 'fa-solid fa-volume-high text-sm' : 'fa-solid fa-volume-xmark text-sm text-rose-400';
        }

        // --- Magic Square Generators ---
        function generateMagicSquare(n) {
            let grid = Array.from({ length: n }, () => Array(n).fill(0));

            if (n % 2 === 1) {
                // Odd size (Siam's Method)
                let i = 0, j = Math.floor(n / 2);
                for (let num = 1; num <= n * n; num++) {
                    grid[i][j] = num;
                    let newI = (i - 1 + n) % n;
                    let newJ = (j + 1) % n;
                    if (grid[newI][newJ] !== 0) {
                        i = (i + 1) % n;
                    } else {
                        i = newI;
                        j = newJ;
                    }
                }
            } else if (n % 4 === 0) {
                // Doubly Even (4x4)
                let num = 1;
                for (let r = 0; r < n; r++) {
                    for (let c = 0; c < n; c++) {
                        let isDiag = (r % 4 === c % 4) || ((r % 4 + c % 4) === 3);
                        grid[r][c] = isDiag ? (n * n + 1 - num) : num;
                        num++;
                    }
                }
            } else {
                // Singly Even (6x6) - LUX Method / Strachey
                let half = n / 2;
                let subSquare = generateMagicSquare(half);
                let subSize = half * half;

                for (let r = 0; r < half; r++) {
                    for (let c = 0; c < half; c++) {
                        let val = subSquare[r][c];
                        grid[r][c] = val; // Top-Left (A)
                        grid[r + half][c + half] = val + subSize; // Bottom-Right (B)
                        grid[r][c + half] = val + 2 * subSize; // Top-Right (C)
                        grid[r + half][c] = val + 3 * subSize; // Bottom-Left (D)
                    }
                }

                let k = (n - 2) / 4;
                for (let r = 0; r < half; r++) {
                    for (let c = 0; c < k; c++) {
                        if (r === Math.floor(half / 2) && c === 0) {
                            let temp = grid[r][k];
                            grid[r][k] = grid[r + half][k];
                            grid[r + half][k] = temp;
                        } else {
                            let temp = grid[r][c];
                            grid[r][c] = grid[r + half][c];
                            grid[r + half][c] = temp;
                        }
                    }
                }
                for (let r = 0; r < half; r++) {
                    for (let c = half - k + 1; c < half; c++) {
                        let temp = grid[r][c];
                        grid[r][c] = grid[r + half][c];
                        grid[r + half][c] = temp;
                    }
                }
            }
            return grid;
        }

        // --- Core Game Initialization ---
        function changeLevel(level) {
            N = parseInt(level);
            targetSum = (N * (N * N + 1)) / 2;
            maxNum = N * N;

            document.getElementById('targetSumDisplay').textContent = targetSum;
            document.getElementById('targetSumFooter').textContent = targetSum;
            document.getElementById('rangeDisplay').textContent = `1 - ${maxNum}`;

            resetGame();
        }

        function resetGame() {
            // Reset state
            userGrid = Array.from({ length: N }, () => Array(N).fill(''));
            solutionGrid = generateMagicSquare(N);
            hintCount = MAX_HINTS;
            updateHintBadge();

            // Reset Timer
            stopTimer();
            secondsElapsed = 0;
            updateTimerDisplay();
            startTimer();

            // Build UI
            renderGrid();
            validateGrid();
        }

        function updateHintBadge() {
            const badge = document.getElementById('hintBadge');
            const btn = document.getElementById('hintBtn');
            badge.textContent = `${hintCount}/${MAX_HINTS}`;
            
            if (hintCount <= 0) {
                btn.classList.add('opacity-50', 'cursor-not-allowed');
                badge.classList.replace('bg-amber-500', 'bg-slate-600');
            } else {
                btn.classList.remove('opacity-50', 'cursor-not-allowed');
                badge.classList.replace('bg-slate-600', 'bg-amber-500');
            }
        }

        // --- Timer Controls ---
        function startTimer() {
            if (timerInterval) clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                secondsElapsed++;
                updateTimerDisplay();
            }, 1000);
        }

        function stopTimer() {
            if (timerInterval) clearInterval(timerInterval);
        }

        function updateTimerDisplay() {
            const mins = Math.floor(secondsElapsed / 60).toString().padStart(2, '0');
            const secs = (secondsElapsed % 60).toString().padStart(2, '0');
            document.getElementById('timerDisplay').textContent = `${mins}:${secs}`;
        }

        // --- Grid Rendering (Single Screen Scaled) ---
        function renderGrid() {
            const container = document.getElementById('gridContainer');
            const totalDim = N + 2; // Total grid columns/rows including headers

            // Calculated size based on N to fit perfectly in viewport
            let fontClass = 'text-base sm:text-lg';
            let labelFontClass = 'text-[10px] sm:text-xs';
            if (N >= 5) {
                fontClass = 'text-xs sm:text-sm';
                labelFontClass = 'text-[9px] sm:text-[10px]';
            }
            if (N >= 7) {
                fontClass = 'text-[11px] sm:text-xs';
                labelFontClass = 'text-[8px] sm:text-[9px]';
            }

            let html = `<div class="grid gap-1 sm:gap-1.5 w-full max-w-[420px] aspect-square p-2 glass-panel rounded-2xl shadow-2xl" style="grid-template-columns: repeat(${totalDim}, minmax(0, 1fr));">`;

            for (let r = 0; r < totalDim; r++) {
                for (let c = 0; c < totalDim; c++) {
                    // Top-Left Corner
                    if (r === 0 && c === 0) {
                        html += `<div class="cell-label rounded-lg flex items-center justify-center font-bold text-amber-400 ${labelFontClass}">D1</div>`;
                    }
                    // Top Row Column Labels (K1..Kn)
                    else if (r === 0 && c > 0 && c <= N) {
                        html += `<div class="cell-label rounded-lg flex items-center justify-center text-slate-400 ${labelFontClass}">K${c}</div>`;
                    }
                    // Top-Right Corner
                    else if (r === 0 && c === totalDim - 1) {
                        html += `<div class="cell-label rounded-lg flex items-center justify-center font-bold text-amber-400 ${labelFontClass}">D2</div>`;
                    }
                    // Left Column Row Labels (B1..Bn)
                    else if (c === 0 && r > 0 && r <= N) {
                        html += `<div class="cell-label rounded-lg flex items-center justify-center text-slate-400 ${labelFontClass}">B${r}</div>`;
                    }
                    // Right Column Row Sums (Sum B1..Bn)
                    else if (c === totalDim - 1 && r > 0 && r <= N) {
                        html += `<div id="sum-row-${r-1}" class="cell-sum sum-neutral rounded-lg flex items-center justify-center font-outfit ${fontClass}">0</div>`;
                    }
                    // Bottom-Left Corner (Sum D2)
                    else if (r === totalDim - 1 && c === 0) {
                        html += `<div id="sum-d2" class="cell-sum sum-neutral rounded-lg flex items-center justify-center font-outfit font-bold ${fontClass}">0</div>`;
                    }
                    // Bottom Row Column Sums (Sum K1..Kn)
                    else if (r === totalDim - 1 && c > 0 && c <= N) {
                        html += `<div id="sum-col-${c-1}" class="cell-sum sum-neutral rounded-lg flex items-center justify-center font-outfit ${fontClass}">0</div>`;
                    }
                    // Bottom-Right Corner (Sum D1)
                    else if (r === totalDim - 1 && c === totalDim - 1) {
                        html += `<div id="sum-d1" class="cell-sum sum-neutral rounded-lg flex items-center justify-center font-outfit font-bold ${fontClass}">0</div>`;
                    }
                    // Middle INPUT Cells (1..N x 1..N)
                    else {
                        const cellR = r - 1;
                        const cellC = c - 1;
                        const val = userGrid[cellR][cellC];
                        const maxLength = maxNum >= 10 ? 2 : 1;

                        html += `
                            <input 
                                type="number" 
                                id="cell-${cellR}-${cellC}"
                                inputmode="numeric"
                                pattern="[0-9]*"
                                min="1"
                                max="${maxNum}"
                                maxlength="${maxLength}"
                                value="${val}"
                                oninput="handleInput(${cellR}, ${cellC}, this)"
                                onkeydown="handleKeyDown(event, ${cellR}, ${cellC})"
                                class="cell-input rounded-xl flex items-center justify-center font-outfit ${fontClass} w-full h-full p-0"
                                autocomplete="off"
                            />
                        `;
                    }
                }
            }

            html += `</div>`;
            container.innerHTML = html;
        }

        // --- Input Handling & Validation ---
        function handleInput(r, c, inputEl) {
            let valStr = inputEl.value;

            // Enforce length limit
            if (valStr.length > (maxNum >= 10 ? 2 : 1)) {
                valStr = valStr.slice(-2);
            }

            let num = parseInt(valStr);

            if (isNaN(num) || num <= 0) {
                userGrid[r][c] = '';
                inputEl.value = '';
                inputEl.classList.remove('filled');
            } else {
                userGrid[r][c] = num;
                inputEl.value = num;
                inputEl.classList.add('filled');
                playSound('type');
            }

            validateGrid();
        }

        function handleKeyDown(e, r, c) {
            // Arrow key navigation
            let targetR = r, targetC = c;
            if (e.key === 'ArrowUp') targetR = Math.max(0, r - 1);
            else if (e.key === 'ArrowDown') targetR = Math.min(N - 1, r + 1);
            else if (e.key === 'ArrowLeft') targetC = Math.max(0, c - 1);
            else if (e.key === 'ArrowRight') targetC = Math.min(N - 1, c + 1);

            if (targetR !== r || targetC !== c) {
                e.preventDefault();
                const targetInput = document.getElementById(`cell-${targetR}-${targetC}`);
                if (targetInput) targetInput.focus();
            }
        }

        function validateGrid() {
            // 1. Check for Exceeded Numbers (> N^2) and Duplicates
            const numCounts = {};
            let hasExceeded = false;
            let hasDuplicates = false;

            for (let r = 0; r < N; r++) {
                for (let c = 0; c < N; c++) {
                    const val = userGrid[r][c];
                    if (val !== '') {
                        if (val > maxNum) {
                            hasExceeded = true;
                        }
                        numCounts[val] = (numCounts[val] || 0) + 1;
                        if (numCounts[val] > 1) {
                            hasDuplicates = true;
                        }
                    }
                }
            }

            // Update UI styles for input cells
            for (let r = 0; r < N; r++) {
                for (let c = 0; c < N; c++) {
                    const inputEl = document.getElementById(`cell-${r}-${c}`);
                    if (!inputEl) continue;

                    const val = userGrid[r][c];
                    inputEl.classList.remove('duplicate', 'exceeded');

                    if (val !== '') {
                        if (val > maxNum) {
                            inputEl.classList.add('exceeded');
                        } else if (numCounts[val] > 1) {
                            inputEl.classList.add('duplicate');
                        }
                    }
                }
            }

            // Update Warning Banner
            const banner = document.getElementById('warningBanner');
            const bannerText = document.getElementById('warningText');
            if (hasExceeded) {
                banner.classList.remove('hidden');
                bannerText.textContent = `Angka melebihi batas (Maks. ${maxNum})!`;
                playSound('error');
            } else if (hasDuplicates) {
                banner.classList.remove('hidden');
                bannerText.textContent = `Ada angka kembar / duplikat!`;
                playSound('error');
            } else {
                banner.classList.add('hidden');
            }

            // 2. Calculate Sums for Rows, Cols, Diagonals
            let rowSums = Array(N).fill(0);
            let rowFilled = Array(N).fill(true);

            let colSums = Array(N).fill(0);
            let colFilled = Array(N).fill(true);

            let d1Sum = 0, d1Filled = true;
            let d2Sum = 0, d2Filled = true;

            for (let r = 0; r < N; r++) {
                for (let c = 0; c < N; c++) {
                    const val = userGrid[r][c];
                    if (val === '') {
                        rowFilled[r] = false;
                        colFilled[c] = false;
                        if (r === c) d1Filled = false;
                        if (r + c === N - 1) d2Filled = false;
                    } else {
                        rowSums[r] += val;
                        colSums[c] += val;
                        if (r === c) d1Sum += val;
                        if (r + c === N - 1) d2Sum += val;
                    }
                }
            }

            // Helper function to update sum badge state
            const updateSumBadge = (elId, sumVal, isFull) => {
                const el = document.getElementById(elId);
                if (!el) return;
                el.textContent = sumVal;

                el.classList.remove('sum-neutral', 'sum-correct', 'sum-wrong');
                if (!isFull && sumVal === 0) {
                    el.classList.add('sum-neutral');
                } else if (sumVal === targetSum && isFull) {
                    el.classList.add('sum-correct');
                } else if (sumVal > targetSum || (isFull && sumVal !== targetSum)) {
                    el.classList.add('sum-wrong');
                } else {
                    el.classList.add('sum-neutral');
                }
            };

            // Apply to Rows
            for (let r = 0; r < N; r++) {
                updateSumBadge(`sum-row-${r}`, rowSums[r], rowFilled[r]);
            }
            // Apply to Cols
            for (let c = 0; c < N; c++) {
                updateSumBadge(`sum-col-${c}`, colSums[c], colFilled[c]);
            }
            // Apply to Diagonals
            updateSumBadge('sum-d1', d1Sum, d1Filled);
            updateSumBadge('sum-d2', d2Sum, d2Filled);

            // 3. Check Winning Condition
            let isWin = !hasDuplicates && !hasExceeded &&
                rowFilled.every(f => f) && rowSums.every(s => s === targetSum) &&
                colFilled.every(f => f) && colSums.every(s => s === targetSum) &&
                d1Filled && d1Sum === targetSum &&
                d2Filled && d2Sum === targetSum;

            if (isWin) {
                handleWin();
            }
        }

        // --- Hint Functionality (Max 3) ---
        function giveHint() {
            if (hintCount <= 0) return;

            // Find empty or wrong cells
            let candidates = [];
            for (let r = 0; r < N; r++) {
                for (let c = 0; c < N; c++) {
                    if (userGrid[r][c] !== solutionGrid[r][c]) {
                        candidates.push({ r, c });
                    }
                }
            }

            if (candidates.length === 0) return;

            // Pick a random incorrect cell and fill with correct answer
            const choice = candidates[Math.floor(Math.random() * candidates.length)];
            const correctVal = solutionGrid[choice.r][choice.c];

            userGrid[choice.r][choice.c] = correctVal;
            const inputEl = document.getElementById(`cell-${choice.r}-${choice.c}`);
            if (inputEl) {
                inputEl.value = correctVal;
                inputEl.classList.add('filled');
                inputEl.focus();
            }

            hintCount--;
            updateHintBadge();
            playSound('type');
            validateGrid();
        }

        // --- Winning Handler ---
        function handleWin() {
            stopTimer();
            playSound('win');

            // Trigger Confetti Celebration
            confetti({
                particleCount: 120,
                spread: 70,
                origin: { y: 0.6 }
            });

            document.getElementById('finalTime').textContent = document.getElementById('timerDisplay').textContent;
            document.getElementById('finalLevel').textContent = `${N} x ${N}`;
            document.getElementById('winModal').classList.remove('hidden');
        }

        function closeWinModal() {
            document.getElementById('winModal').classList.add('hidden');
        }

        // Initialize game on startup
        window.onload = () => {
            changeLevel(3);
        };

        (function() {
            window.addEventListener('contextmenu', e => { e.preventDefault(); e.stopPropagation(); }, true);
            window.addEventListener('keydown', function(e) {
                if (e.key === 'F12') { e.preventDefault(); e.stopPropagation(); }
                if (e.ctrlKey && e.shiftKey && ['I', 'J', 'C'].includes(e.key.toUpperCase())) { e.preventDefault(); e.stopPropagation(); }
                if (e.ctrlKey && ['U', 'S', 'A', 'C'].includes(e.key.toUpperCase())) { e.preventDefault(); e.stopPropagation(); }
            }, true);
        })();        

</script>
</body>
