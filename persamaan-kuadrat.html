<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>Lab Detektif: Persamaan Kuadrat 3 Metode</title>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Fredoka:wght@400;600;700&display=swap" rel="stylesheet">
    
    <style>
        * {
            box-sizing: border-box;
            font-family: 'Fredoka', sans-serif;
            -webkit-tap-highlight-color: transparent;
        }

        body {
            background: #9B5DE5;
            background-image: radial-gradient(#6D28D9 20%, transparent 20%), radial-gradient(#6D28D9 20%, transparent 20%);
            background-size: 20px 20px;
            background-position: 0 0, 10px 10px;
            display: flex;
            justify-content: center;
            align-items: flex-start;
            min-height: 100vh;
            margin: 0;
            padding: 10px;
        }

        .game-container {
            background: #FFFFFF;
            border: 6px solid #3F0071;
            border-radius: 30px;
            width: 100%;
            max-width: 440px;
            min-height: 94vh;
            box-shadow: 0 12px 0 #3F0071;
            overflow: hidden;
            display: flex;
            flex-direction: column;
            position: relative;
        }

        .game-header {
            background: #7209B7;
            padding: 15px;
            text-align: center;
            border-bottom: 6px solid #3F0071;
            color: white;
            text-shadow: 3px 3px 0px #3F0071;
        }

        .game-header h1 {
            margin: 0;
            font-size: 1.5rem;
            letter-spacing: 1px;
        }

        .game-header p {
            margin: 4px 0 0 0;
            font-size: 0.85rem;
            font-weight: 400;
            opacity: 0.9;
        }

        .main-content {
            padding: 15px;
            display: flex;
            flex-direction: column;
            flex: 1;
            margin-bottom: 240px;
        }

        .input-section {
            background: #F4F6F9;
            border: 3px dashed #7209B7;
            border-radius: 20px;
            padding: 12px;
            margin-bottom: 12px;
            display: flex;
            flex-direction: column;
            align-items: center;
            gap: 8px;
        }

        .eq-row {
            display: flex;
            align-items: center;
            justify-content: center;
            gap: 4px;
            font-size: 1.15rem;
            font-weight: 700;
            color: #3F0071;
        }

        .game-input {
            width: 50px;
            padding: 6px 2px;
            border: 3px solid #7209B7;
            border-radius: 12px;
            font-size: 1.15rem;
            font-weight: 700;
            text-align: center;
            background: #FFF;
            color: #333;
            cursor: pointer;
        }

        .game-input:focus {
            outline: none;
            background: #F3E5F5;
            border-color: #F15BB5;
        }

        #soal-text {
            font-size: 1.3rem;
            font-weight: 700;
            color: #7209B7;
            margin: 2px 0;
            background: #E0AAFF;
            padding: 4px 16px;
            border-radius: 15px;
            border: 2px solid #3F0071;
            text-align: center;
        }

        .btn-group {
            display: grid;
            grid-template-columns: repeat(2, 1fr);
            gap: 8px;
            margin-bottom: 12px;
        }

        button.btn-act {
            padding: 12px 4px;
            font-size: 0.9rem;
            font-weight: 700;
            border-radius: 15px;
            cursor: pointer;
            border: 3px solid #3F0071;
            color: white;
            transition: transform 0.1s;
        }
        button.btn-act:active { transform: translateY(3px); }

        .b-abc { background: #00BBF9; box-shadow: 0 4px 0 #0077B6; }
        .b-abc:active { box-shadow: 0 1px 0 #0077B6; }
        .b-fakt { background: #00F5D4; color: #005F52; box-shadow: 0 4px 0 #00BB9F; }
        .b-fakt:active { box-shadow: 0 1px 0 #00BB9F; }
        .b-kuad { background: #F15BB5; box-shadow: 0 4px 0 #C71585; }
        .b-kuad:active { box-shadow: 0 1px 0 #C71585; }
        .b-reset { background: #FF595E; box-shadow: 0 4px 0 #C1121F; }
        .b-reset:active { box-shadow: 0 1px 0 #C1121F; }

        /* AREA ALUR SOLUSI */
        #solution-flow {
            background: #EDF2F7;
            border: 3px solid #3F0071;
            border-radius: 20px;
            padding: 12px;
            display: none;
            flex-direction: column;
            gap: 12px;
            animation: bounceIn 0.4s ease;
        }

        @keyframes bounceIn {
            0% { transform: scale(0.92); opacity: 0; }
            70% { transform: scale(1.02); }
            100% { transform: scale(1); opacity: 1; }
        }

        .step-card {
            background: #FFF;
            padding: 12px;
            border-radius: 16px;
            border: 2px solid #7209B7;
            box-shadow: inset 0 -4px 0 #E0AAFF;
            margin-bottom: 10px;
            overflow-x: auto;
        }

        .step-title {
            font-size: 0.85rem;
            color: white;
            font-weight: 700;
            margin-bottom: 8px;
            background: #7209B7;
            display: inline-block;
            padding: 3px 12px;
            border-radius: 20px;
            text-transform: uppercase;
        }

        .math-text {
            font-size: 0.95rem;
            line-height: 1.5;
            color: #333;
        }

        /* TABEL RAPI MATEMATIKA */
        .math-table {
            border-collapse: collapse;
            margin: 6px 0;
            width: auto;
        }
        .math-table td { padding: 4px 6px; vertical-align: middle; font-size: 1rem; }
        .math-table td.left-eq { text-align: right; font-weight: 600; color: #3F0071; }
        .math-table td.center-eq { text-align: center; color: #F15BB5; font-weight: bold; width: 25px; }

        /* NOTASI PECAHAN DAN AKAR */
        .fraction {
            display: inline-flex;
            flex-direction: column;
            vertical-align: middle;
            text-align: center;
            line-height: 1.1;
            padding: 0 6px;
            min-width: 30px;
        }
        .fraction .bar { border-top: 2px solid #3F0071; margin: 3px 0; width: 100%; }

        .sqrt-box {
            border-top: 2px solid #3F0071;
            padding-left: 2px;
            display: inline-block;
            vertical-align: middle;
        }

        .result-box {
            background: #E8F5E9;
            border: 2px dashed #2E7D32;
            border-radius: 15px;
            padding: 10px;
            text-align: center;
            margin-top: 8px;
        }
        .hp-text { font-size: 1.1rem; font-weight: 700; color: #1B5E20; display: flex; align-items: center; justify-content: center; gap: 6px; flex-wrap: wrap; }

        /* SMART NUMPAD ALGEBRA */
        .numpad-container {
            background: #E0AAFF;
            border-top: 5px solid #7209B7;
            padding: 10px;
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 6px;
            position: absolute;
            bottom: 0; left: 0; right: 0;
            z-index: 10;
        }

        .num-btn {
            padding: 12px 0;
            font-size: 1.15rem;
            font-weight: 700;
            border-radius: 12px;
            border: none;
            cursor: pointer;
            color: white;
            border-bottom: 4px solid rgba(0,0,0,0.25);
        }
        .num-btn:active { transform: scale(0.94); }

        .c-1 { background: #FF595E; }
        .c-2 { background: #FF9F1C; }
        .c-3 { background: #00BBF9; }
        .c-4 { background: #00F5D4; color: #005F52; }
        .c-spec { background: #F15BB5; }

        /* CUSTOM MODAL OVERLAY */
        .modal-overlay {
            position: absolute;
            top: 0; left: 0; right: 0; bottom: 0;
            background: rgba(63, 0, 113, 0.45);
            backdrop-filter: blur(3px);
            z-index: 100;
            display: flex;
            justify-content: center;
            align-items: center;
            padding: 20px;
            opacity: 0;
            pointer-events: none;
            transition: opacity 0.25s ease;
        }
        .modal-overlay.show { opacity: 1; pointer-events: auto; }

        .modal-box {
            background: #FFFFFF;
            border: 5px solid #FF595E;
            border-radius: 25px;
            padding: 20px;
            width: 100%;
            max-width: 300px;
            text-align: center;
            box-shadow: 0 10px 0 #D62828;
            transform: scale(0.75);
            transition: transform 0.25s cubic-bezier(0.175, 0.885, 0.32, 1.275);
        }
        .modal-overlay.show .modal-box { transform: scale(1); }
        .modal-icon { font-size: 2.5rem; margin-bottom: 6px; }
        .modal-message { font-size: 0.95rem; font-weight: 600; color: #3F0071; margin-bottom: 15px; }
        .btn-modal-close { background: #00F5D4; border: 3px solid #00BB9F; border-radius: 12px; padding: 6px 18px; font-size: 0.95rem; font-weight: 700; color: #005F52; cursor: pointer; box-shadow: 0 4px 0 #00BB9F; }
    </style>
</head>
<body>

<div class="game-container">
    <div id="custom-modal" class="modal-overlay">
        <div class="modal-box">
            <div class="modal-icon">🕵️‍♂️🧪</div>
            <div class="modal-message" id="modal-msg">Detektif, mohon lengkapi angka koefisiennya!</div>
            <button class="btn-modal-close" onclick="closeModal()">Siap, Mengerti! 🚀</button>
        </div>
    </div>

    <div class="game-header">
        <h1>Persamaan Kuadrat</h1>
        <p>Pilih metode penyelesaian yang ingin kamu gunakan!</p>
    </div>

    <div class="main-content">
        <div class="input-section">
            <div class="eq-row">
                <input class="game-input" type="text" id="a" value="2" readonly onclick="setActiveInput('a')">
                <span>x² +</span>
                <input class="game-input" type="text" id="b" value="3" readonly onclick="setActiveInput('b')">
                <span>x +</span>
                <input class="game-input" type="text" id="c" value="1" readonly onclick="setActiveInput('c')">
                <span>= 0</span>
            </div>
            <div id="soal-text">2x² + 3x + 1 = 0</div>
        </div>

        <div class="btn-group">
            <button class="btn-act b-abc" onclick="solve('abc')">🧮 Rumus ABC</button>
            <button class="btn-act b-fakt" onclick="solve('faktorisasi')">🧩 Pemfaktoran</button>
            <button class="btn-act b-kuad" onclick="solve('kuadrat')">⚡ Kuadrat Sempurna</button>
            <button class="btn-act b-reset" onclick="reset()">🧹 Reset</button>
        </div>

        <div id="solution-flow"></div>
    </div>

    <div class="numpad-container" id="global-numpad" style="display: none;">
        <button class="num-btn c-1" onclick="pressKey('1')">1</button>
        <button class="num-btn c-1" onclick="pressKey('2')">2</button>
        <button class="num-btn c-1" onclick="pressKey('3')">3</button>
        <button class="num-btn c-spec" onclick="pressKey('-')">±</button>
        
        <button class="num-btn c-2" onclick="pressKey('4')">4</button>
        <button class="num-btn c-2" onclick="pressKey('5')">5</button>
        <button class="num-btn c-2" onclick="pressKey('6')">6</button>
        <button class="num-btn c-spec" onclick="pressKey('.')">.</button>
        
        <button class="num-btn c-3" onclick="pressKey('7')">7</button>
        <button class="num-btn c-3" onclick="pressKey('8')">8</button>
        <button class="num-btn c-3" onclick="pressKey('9')">9</button>
        <button class="num-btn b-reset" style="grid-row: span 2; height:100%; font-size:1.4rem; margin-bottom:0; padding:0;" onclick="pressKey('del')">⌫</button>
        
        <button class="num-btn c-4" style="grid-column: span 3;" onclick="pressKey('0')">0</button>
    </div>
</div>

<script>
let currentActiveInputId = null;

function showModal(msg) {
    document.getElementById('modal-msg').innerText = msg;
    document.getElementById('custom-modal').classList.add('show');
}

function closeModal() {
    document.getElementById('custom-modal').classList.remove('show');
}

function setActiveInput(id) {
    currentActiveInputId = id;
    document.getElementById('global-numpad').style.display = 'grid';
    document.querySelectorAll('.game-input').forEach(el => el.style.borderColor = '#7209B7');
    document.getElementById(id).style.borderColor = '#F15BB5';
}

function hideNumpad() {
    currentActiveInputId = null;
    document.getElementById('global-numpad').style.display = 'none';
    document.querySelectorAll('.game-input').forEach(el => el.style.borderColor = '#7209B7');
}

function pressKey(key) {
    if (!currentActiveInputId) return;
    const inputEl = document.getElementById(currentActiveInputId);
    let currentVal = inputEl.value;

    if (key === 'del') {
        inputEl.value = currentVal.slice(0, -1);
    } else if (key === '-') {
        if (currentVal.startsWith('-')) {
            inputEl.value = currentVal.slice(1);
        } else {
            inputEl.value = '-' + currentVal;
        }
    } else if (key === '.') {
        if (!currentVal.includes('.')) inputEl.value = currentVal + '.';
    } else {
        if (currentVal === '0') {
            inputEl.value = key;
        } else {
            inputEl.value = currentVal + key;
        }
    }
    updateSoal();
}

// Fungsi utama yang menyempurnakan bentuk notasi matematika
function formatPersamaan(a, b, c) {
    let res = "";

    // Formatting suku a (x²)
    if (a === 1) res += "x²";
    else if (a === -1) res += "-x²";
    else if (a !== 0) res += a + "x²";

    // Formatting suku b (x)
    if (b !== 0) {
        let absB = Math.abs(b);
        let valB = absB === 1 ? "" : absB;
        if (res === "") {
            res += (b < 0 ? "-" : "") + valB + "x";
        } else {
            res += (b > 0 ? " + " : " - ") + valB + "x";
        }
    }

    // Formatting suku c (konstanta)
    if (c !== 0) {
        if (res === "") {
            res += c;
        } else {
            res += (c > 0 ? " + " : " - ") + Math.abs(c);
        }
    }

    return (res === "" ? "0" : res) + " = 0";
}

// Helper formatting untuk bagian dalam kurung / suku matematika di tabel
function formatSukuLinear(coeff, varName = "x") {
    if (coeff === 0) return "";
    if (coeff === 1) return varName;
    if (coeff === -1) return "-" + varName;
    return coeff + varName;
}

function toFrac(decimal) {
    if (decimal === 0) return "0";
    if (Number.isInteger(decimal)) return decimal.toString();
    const sign = decimal < 0 ? "-" : "";
    let x = Math.abs(decimal), h1 = 1, h2 = 0, k1 = 0, k2 = 1, b = x;
    for (let i = 0; i < 10; i++) {
        let a = Math.floor(b);
        let aux = h1; h1 = a * h1 + h2; h2 = aux;
        aux = k1; k1 = a * k1 + k2; k2 = aux;
        if (Math.abs(x - h1 / k1) < 1.0e-6) break;
        b = 1 / (b - a);
    }
    return k1 === 1 ? sign + h1 : `${sign}<div class="fraction"><span>${h1}</span><span class="bar"></span><span>${k1}</span></div>`;
}

function updateSoal() {
    const a = parseFloat(document.getElementById('a').value) || 0;
    const b = parseFloat(document.getElementById('b').value) || 0;
    const c = parseFloat(document.getElementById('c').value) || 0;
    document.getElementById('soal-text').innerHTML = formatPersamaan(a, b, c);
}

function getGCD(a, b) { return b ? getGCD(b, a % b) : Math.abs(a); }

function solve(method) {
    const a = parseFloat(document.getElementById('a').value);
    const b = parseFloat(document.getElementById('b').value);
    const c = parseFloat(document.getElementById('c').value);
    const flow = document.getElementById('solution-flow');

    if (isNaN(a) || isNaN(b) || isNaN(c)) {
        showModal("🕵️‍♂️ Mohon isi semua kotak nilai koefisien (a, b, c) terlebih dahulu!");
        return;
    }
    if (a === 0) {
        showModal("⚠️ Nilai koefisien (a) tidak boleh 0 karena merusak pola kuadrat!");
        return;
    }

    hideNumpad();

    const D = b * b - 4 * a * c;
    const x1 = (-b + Math.sqrt(D)) / (2 * a);
    const x2 = (-b - Math.sqrt(D)) / (2 * a);

    let html = `<h3 style="margin: 5px 0; font-size:1.1rem; color:#3F0071; text-align:center;">🧪 Metode: ${method === 'abc' ? 'Rumus ABC' : method === 'faktorisasi' ? 'Pemfaktoran' : 'Kuadrat Sempurna'}</h3>`;

    if (method === 'abc') {
        html += `
            <div class="step-card">
                <span class="step-title">Mencari Diskriminan (D)</span>
                <table class="math-table">
                    <tr><td class="left-eq">D</td><td class="center-eq">=</td><td>b² &minus; 4ac</td></tr>
                    <tr><td class="left-eq">D</td><td class="center-eq">=</td><td>(${b})² &minus; 4 &times; (${a}) &times; (${c})</td></tr>
                    <tr><td class="left-eq">D</td><td class="center-eq">=</td><td>${b*b} &minus; (${4*a*c})</td></tr>
                    <tr><td class="left-eq">D</td><td class="center-eq">=</td><td><b>${D}</b></td></tr>
                </table>
            </div>`;
        
        if (D >= 0) {
            html += `
                <div class="step-card">
                    <span class="step-title">Substitusi Rumus ABC</span>
                    <table class="math-table">
                        <tr>
                            <td class="left-eq">x₁,₂</td>
                            <td class="center-eq">=</td>
                            <td>
                                <div class="fraction">
                                    <span>&minus;b &plusmn; <span style="font-size:1.1rem;">&radic;</span><span class="sqrt-box">D</span></span>
                                    <span class="bar"></span>
                                    <span>2a</span>
                                </div>
                            </td>
                        </tr>
                        <tr>
                            <td class="left-eq">x₁,₂</td>
                            <td class="center-eq">=</td>
                            <td>
                                <div class="fraction">
                                    <span>&minus;(${b}) &plusmn; <span style="font-size:1.1rem;">&radic;</span><span class="sqrt-box">${D}</span></span>
                                    <span class="bar"></span>
                                    <span>2(${a})</span>
                                </div>
                            </td>
                        </tr>
                    </table>
                </div>
                
                <div class="step-card">
                    <span class="step-title">Pecah Solusi Akar</span>
                    <table class="math-table">
                        <tr>
                            <td class="left-eq">x₁</td>
                            <td class="center-eq">=</td>
                            <td>
                                <div class="fraction">
                                    <span>${-b} + ${Math.round(Math.sqrt(D)*100)/100}</span>
                                    <span class="bar"></span>
                                    <span>${2*a}</span>
                                </div>
                                &nbsp;=&nbsp;<b>${toFrac(x1)}</b>
                            </td>
                        </tr>
                        <tr>
                            <td class="left-eq">x₂</td>
                            <td class="center-eq">=</td>
                            <td>
                                <div class="fraction">
                                    <span>${-b} &minus; ${Math.round(Math.sqrt(D)*100)/100}</span>
                                    <span class="bar"></span>
                                    <span>${2*a}</span>
                                </div>
                                &nbsp;=&nbsp;<b>${toFrac(x2)}</b>
                            </td>
                        </tr>
                    </table>
                </div>`;
        }
    } 
    else if (method === 'faktorisasi') {
        let p, q, found = false;
        for (let i = -250; i <= 250; i++) {
            let j = (a * c) / i;
            if (i + j === b && i * j === a * c) { p = i; q = j; found = true; break; }
        }
        if (found) {
            let gcdAP = getGCD(a, Math.abs(p));
            let gcdAQ = getGCD(a, Math.abs(q));
            
            let term1_a = a / gcdAP;
            let term1_p = p / gcdAP;
            let term2_a = a / gcdAQ;
            let term2_q = q / gcdAQ;

            html += `
                <div class="step-card">
                    <span class="step-title">Mencari Faktor Nilai</span>
                    <p class="math-text" style="margin:4px 0;">
                        Cari kombinasi angka ac: p &times; q = <b>${a*c}</b> dan p + q = <b>${b}</b>.<br>
                        Didapat nilai: p = <b>${p}</b>, q = <b>${q}</b>
                    </p>
                </div>
                
                <div class="step-card">
                    <span class="step-title">Distribusi dan Penyederhanaan</span>
                    <table class="math-table">
                        <tr>
                            <td class="left-eq">
                                <div class="fraction">
                                    <span>( ${formatSukuLinear(a)} ${p >= 0 ? '+ '+p : '&minus; '+Math.abs(p)} )( ${formatSukuLinear(a)} ${q >= 0 ? '+ '+q : '&minus; '+Math.abs(q)} )</span>
                                    <span class="bar"></span>
                                    <span>${a}</span>
                                </div>
                            </td>
                            <td class="center-eq">=</td>
                            <td>0</td>
                        </tr>
                        <tr>
                            <td class="left-eq">
                                ( ${formatSukuLinear(term1_a)} ${term1_p >= 0 ? '+ '+term1_p : '&minus; '+Math.abs(term1_p)} ) 
                                ( ${formatSukuLinear(term2_a)} ${term2_q >= 0 ? '+ '+term2_q : '&minus; '+Math.abs(term2_q)} )
                            </td>
                            <td class="center-eq">=</td>
                            <td>0</td>
                        </tr>
                    </table>
                </div>

                <div class="step-card">
                    <span class="step-title">Penyelesaian Faktor Akar</span>
                    <table class="math-table">
                        <tr>
                            <td class="left-eq">${formatSukuLinear(term1_a, "x₁")} ${term1_p >= 0 ? '+ '+term1_p : '&minus; '+Math.abs(term1_p)}</td>
                            <td class="center-eq">=</td>
                            <td>0 &nbsp;&rarr;&nbsp; x₁ = <b>${toFrac(x1)}</b></td>
                        </tr>
                        <tr>
                            <td class="left-eq">${formatSukuLinear(term2_a, "x₂")} ${term2_q >= 0 ? '+ '+term2_q : '&minus; '+Math.abs(term2_q)}</td>
                            <td class="center-eq">=</td>
                            <td>0 &nbsp;&rarr;&nbsp; x₂ = <b>${toFrac(x2)}</b></td>
                        </tr>
                    </table>
                </div>`;
        } else {
            html += `<div class="step-card"><p class="math-text" style="color:#C1121F; text-align:center;">🕵️‍♂️ Faktor bulat tidak ditemukan. Selesaikan misi ini memakai Rumus ABC!</p></div>`;
        }
    }
    else if (method === 'kuadrat') {
        const halfB = b / (2 * a);
        const rightSide1 = -c / a;
        const rightSide2 = halfB * halfB;
        const totalRight = rightSide1 + rightSide2;

        html += `
            <div class="step-card">
                <span class="step-title">Penyusunan Sisi Konstanta</span>
                <table class="math-table">
                    <tr>
                        <td class="left-eq">${formatPersamaan(a, b, c).replace(' = 0', '')}</td>
                        <td class="center-eq">=</td>
                        <td>0</td>
                    </tr>
                    <tr>
                        <td class="left-eq">${formatPersamaan(a, b, 0).replace(' = 0', '')}</td>
                        <td class="center-eq">=</td>
                        <td>${-c}</td>
                    </tr>
                    <tr>
                        <td class="left-eq">x² ${b/a !== 0 ? (b/a > 0 ? '+ ' : '&minus; ') + (Math.abs(b/a) === 1 ? '' : toFrac(Math.abs(b/a))) + 'x' : ''}</td>
                        <td class="center-eq">=</td>
                        <td>${toFrac(-c/a)}</td>
                    </tr>
                </table>
            </div>

            <div class="step-card">
                <span class="step-title">Penambahan Kuadrat Sempurna Sisi Kiri-Kanan</span>
                <table class="math-table">
                    <tr>
                        <td class="left-eq">x² ${b/a !== 0 ? (b/a > 0 ? '+ ' : '&minus; ') + (Math.abs(b/a) === 1 ? '' : toFrac(Math.abs(b/a))) + 'x' : ''} + ( ${toFrac(halfB)} )²</td>
                        <td class="center-eq">=</td>
                        <td>${toFrac(-c/a)} + ( ${toFrac(halfB)} )²</td>
                    </tr>
                    <tr>
                        <td class="left-eq">( x ${halfB >= 0 ? '+ '+toFrac(halfB) : '&minus; '+toFrac(Math.abs(halfB))} )²</td>
                        <td class="center-eq">=</td>
                        <td>${toFrac(-c/a)} + ${toFrac(rightSide2)}</td>
                    </tr>
                    <tr>
                        <td class="left-eq">( x ${halfB >= 0 ? '+ '+toFrac(halfB) : '&minus; '+toFrac(Math.abs(halfB))} )²</td>
                        <td class="center-eq">=</td>
                        <td>${toFrac(totalRight)}</td>
                    </tr>
                </table>
            </div>

            <div class="step-card">
                <span class="step-title">Penarikan Akar Kuadrat</span>
                <table class="math-table">
                    <tr>
                        <td class="left-eq">x ${halfB >= 0 ? '+ '+toFrac(halfB) : '&minus; '+toFrac(Math.abs(halfB))}</td>
                        <td class="center-eq">=</td>
                        <td>&plusmn; ${D >= 0 ? toFrac(Math.sqrt(totalRight)) : 'i'}</td>
                    </tr>
                    <tr>
                        <td class="left-eq">x₁</td>
                        <td class="center-eq">=</td>
                        <td>${D >= 0 ? toFrac(Math.sqrt(totalRight)) : 'i'} &minus; ( ${toFrac(halfB)} ) = <b>${toFrac(x1)}</b></td>
                    </tr>
                    <tr>
                        <td class="left-eq">x₂</td>
                        <td class="center-eq">=</td>
                        <td>${D >= 0 ? toFrac(-Math.sqrt(totalRight)) : '-i'} &minus; ( ${toFrac(halfB)} ) = <b>${toFrac(x2)}</b></td>
                    </tr>
                </table>
            </div>`;
    }

    if (D >= 0) {
        html += `
            <div class="result-box">
                <div class="hp-text">
                    <span>🎯 Himpunan Penyelesaian:</span>
                    <span>{</span> ${toFrac(x1)} <span>,</span> ${toFrac(x2)} <span>}</span>
                </div>
            </div>`;
    } else {
        html += `<div class="result-box" style="background:#FFEEF0; border-color:#FF595E;"><div class="hp-text" style="color:#C1121F;">❌ Nilai Akar Imajiner (Tidak Nyata)</div></div>`;
    }

    flow.innerHTML = html;
    flow.style.display = "flex";
}

function reset() {
    document.getElementById('a').value = '';
    document.getElementById('b').value = '';
    document.getElementById('c').value = '';
    document.getElementById('solution-flow').style.display = "none";
    updateSoal();
    hideNumpad();
}
// GLOBAL BULLETPROOF SECURITY LAYER
(function() {
    window.addEventListener('contextmenu', e => { e.preventDefault(); e.stopPropagation(); }, true);
    window.addEventListener('keydown', function(e) {
        if (e.key === 'F12') { e.preventDefault(); e.stopPropagation(); }
        if (e.ctrlKey && e.shiftKey && ['I', 'J', 'C'].includes(e.key.toUpperCase())) { e.preventDefault(); e.stopPropagation(); }
        if (e.ctrlKey && ['U', 'S', 'A', 'C'].includes(e.key.toUpperCase())) { e.preventDefault(); e.stopPropagation(); }
    }, true);
})();
</script>
