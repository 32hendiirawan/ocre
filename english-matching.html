<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>English Matching Game</title>
    <style>
        :root {
            --primary: #3498db;
            --success: #2ecc71;
            --danger: #e74c3c;
            --bg: skyblue;
            --text: #2c3e50;
        }

        body, html { 
            margin: 0; padding: 0; height: 100%; 
            font-family: 'Segoe UI', sans-serif;
            background-color: var(--bg);
            overflow: hidden;
            color: var(--text);
        }

        /* --- HALAMAN DEPAN --- */
        #home-screen {
            display: flex; flex-direction: column; align-items: center; justify-content: center;
            height: 100vh; text-align: center;
        }

        .menu-grid {
            display: grid; grid-template-columns: repeat(2, 1fr); gap: 15px;
            max-width: 500px; width: 90%;
        }

        .btn-theme {
            padding: 20px; font-size: 1.1rem; font-weight: bold; border: none;
            border-radius: 15px; background: white; cursor: pointer;
            box-shadow: 0 4px 10px rgba(0,0,0,0.1); transition: 0.3s;
        }

        .btn-theme:hover { background: var(--primary); color: white; transform: translateY(-3px); }

        /* --- HALAMAN PERMAINAN --- */
        #game-screen {
            display: none; position: relative; height: 100vh; width: 100vw;
            flex-direction: column; padding: 15px; box-sizing: border-box;
        }

        .game-header {
            display: flex; justify-content: space-between; align-items: center;
            padding: 10px 20px; z-index: 20; background: white; border-radius: 12px;
        }

        .game-wrapper {
            flex-grow: 1; position: relative; margin-top: 15px;
            /* Container ini adalah titik nol koordinat canvas */
        }

        #lineCanvas {
            position: absolute; top: 0; left: 0;
            pointer-events: none; z-index: 5;
        }

        .game-area {
            display: flex; justify-content: space-between; height: 100%;
            position: relative; z-index: 10;
        }

        .column { width: 32%; display: flex; flex-direction: column; justify-content: space-around; }

        .card { 
            padding: 12px; border: 3px solid #ddd; border-radius: 15px; cursor: pointer; 
            background: #fff; font-weight: bold; text-align: center; font-size: 1.2rem;
            transition: 0.2s; box-shadow: 0 4px 6px rgba(0,0,0,0.05);
        }
        
        .card.selected { border-color: var(--primary); background: #e1f5fe; }
        .card.correct { border-color: var(--success); opacity: 0.6; cursor: default; }

        .card img { width: 60px; height: 60px; object-fit: contain; pointer-events: none; display: block; margin: auto; }

        #win-message {
            position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%);
            background: white; padding: 40px; border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.3); text-align: center;
            display: none; z-index: 100;
        }
    </style>
</head>
<body>

    <!-- LOBBY -->
    <div id="home-screen">
        <h1 style="line-height: normal; margin-bottom: 0px;">ENGLISH</h1>
        <h3 style="line-height: normal; margin-top: 0px;">Matching Game</h3>
        <div class="menu-grid">
            <button class="btn-theme" onclick="initGame('numbers')">Numbers</button>
            <button class="btn-theme" onclick="initGame('colors')">Colors</button>
            <button class="btn-theme" onclick="initGame('animals')">Animals</button>
            <button class="btn-theme" onclick="initGame('fruits')">Fruits</button>
            <button class="btn-theme" onclick="initGame('body')">Body Parts</button>
            <button class="btn-theme" onclick="initGame('professions')">Professions</button>
        </div>
        <button class="btn-theme" style="margin-top:20px;" onclick="toggleFullScreen()">Fullscreen</button>
    </div>

    <!-- GAMEPLAY -->
    <div id="game-screen">
        <div class="game-header">
            <button class="btn-theme" onclick="goBack()">← Back</button>
            <h2 id="theme-title" style="margin:0;">THEME</h2>
            <div id="score-text">Score: 0/5</div>
        </div>

        <div class="game-wrapper" id="game-wrapper">
            <canvas id="lineCanvas"></canvas>
            <div class="game-area">
                <div class="column" id="words-column"></div>
                <div class="column" id="images-column"></div>
            </div>
        </div>

        <div id="win-message">
            <h2>🎉 Well Done!</h2>
            <button class="btn-theme" onclick="goBack()">Play Again</button>
        </div>
    </div>

<script>
    const dataStock = {
        numbers: [
            {n:'One', i:'https://i.pinimg.com/736x/4f/52/f3/4f52f37ef487c0360189f58b228fd0b0.jpg'},
            {n:'Two', i:'https://i.pinimg.com/736x/24/f0/d1/24f0d1104857d05c1c57d66371449685.jpg'},
            {n:'Three', i:'https://i.pinimg.com/736x/ee/6f/c2/ee6fc2d51b9f7e622ea3aa3a55f157b4.jpg'},
            {n:'Four', i:'https://i.pinimg.com/736x/62/8c/b4/628cb495e0dfcf42b3470ed5f781d22a.jpg'},
            {n:'Five', i:'https://i.pinimg.com/736x/8b/7a/50/8b7a50ddfe2a7b7b0702f8a0f25725bb.jpg'},
            {n:'Six', i:'https://i.pinimg.com/736x/21/93/04/219304221089fc6427757be1524b0fe9.jpg'},
            {n:'Seven', i:'https://i.pinimg.com/736x/5f/b1/76/5fb17634dd00b4c9563cd51b8a16580e.jpg'},
            {n:'Eight', i:'https://i.pinimg.com/736x/bc/c0/bd/bcc0bd628d74227640ed6156035c01f9.jpg'},
            {n:'Nine', i:'https://i.pinimg.com/736x/83/d8/17/83d8174893d0671440f31bb38cfd32fe.jpg'},
            {n:'Ten', i:'https://i.pinimg.com/736x/18/6c/5d/186c5d75edda79995872883f2aeff423.jpg'}
        ],
        colors: [
            {n:'Red', i:'https://i.pinimg.com/1200x/34/03/52/3403520989710c6e1dbffceae18b4960.jpg'},
            {n:'Green', i:'https://i.pinimg.com/736x/e7/c5/95/e7c595548b4cf494472c67f53952d9a7.jpg'},
            {n:'Blue', i:'https://i.pinimg.com/1200x/54/8d/c7/548dc74e7ca78660949276fe976de222.jpg'},
            {n:'Yellow', i:'https://i.pinimg.com/1200x/73/46/95/734695b8cbe45485127784142a6374dc.jpg'},
            {n:'Orange', i:'https://i.pinimg.com/1200x/d0/be/26/d0be26e6d0cefff7e8794c546f541058.jpg'},
        ],
        animals: [
            {n:'Lion', i:'https://i.pinimg.com/736x/7a/e3/82/7ae3821d216b2e3b39ee9a0a8b465c8a.jpg'}, 
            {n:'Cat', i:'https://i.pinimg.com/736x/0b/4b/cd/0b4bcd0fb7a06abc263a33d2448bc6ce.jpg'}, 
            {n:'Mouse', i:'https://i.pinimg.com/1200x/bf/74/43/bf74430ec1ddae5fb4bfed3b4b2154c5.jpg'}, 
            {n:'Duck', i:'https://i.pinimg.com/1200x/30/c7/f6/30c7f69f30463cb29fb9d04d6e12a002.jpg'}, 
            {n:'Bird', i:'https://i.pinimg.com/736x/0c/e4/88/0ce488a950b62f7139bfbba4c09db8c7.jpg'},
            {n:'Elephant', i:'https://i.pinimg.com/736x/f6/0e/42/f60e42332dfe603f9b7bd038842865b6.jpg'},
            {n:'Giraffe', i:'https://i.pinimg.com/1200x/3b/56/64/3b5664032a75fe73d363b375dda48563.jpg'},
            {n:'Crocodile', i:'https://i.pinimg.com/1200x/ee/3c/1a/ee3c1a92f1b4ed3b40a4a8f10ad4e37b.jpg'},
        ],
        fruits: [
            {n:'Apple', i:'https://i.pinimg.com/736x/e0/3b/06/e03b06fb3ea1bd333a7a85f7951bb51b.jpg'}, 
            {n:'Grape', i:'https://i.pinimg.com/736x/9e/7b/23/9e7b239ebe3bc97d25ce09ee4859b6d5.jpg'}, 
            {n:'Mango', i:'https://i.pinimg.com/736x/23/82/c9/2382c9ca6e55b1c8e52d0eb587328139.jpg'}, 
            {n:'Cherry', i:'https://i.pinimg.com/736x/3e/44/18/3e441868a39d6ddac14560c603e93e0b.jpg'},
            {n:'Orange', i:'https://i.pinimg.com/736x/20/55/34/205534442c0f83146d4e4d42a0b8403e.jpg'},
            {n:'Star Fruit', i:'https://i.pinimg.com/736x/17/07/d1/1707d124bdd1f20bcc27d5ab117b1cd2.jpg'},
            {n:'Banana', i:'https://i.pinimg.com/736x/31/42/45/314245035f92581abe3472c06f4b2138.jpg'},
        ],
        body: [
            {n:'Ear', i:'https://i.pinimg.com/736x/cc/22/52/cc2252fd83e01d8c00b5f89cdae68a28.jpg'}, 
            {n:'Hand', i:'https://i.pinimg.com/1200x/02/30/60/02306075833215b55e7dd514c377c90b.jpg'}, 
            {n:'Foot', i:'https://i.pinimg.com/736x/48/a0/1d/48a01d17ad43d68ab599cdf7c712295d.jpg'}, 
            {n:'Eye', i:'https://i.pinimg.com/736x/51/4d/fc/514dfcc69877227188e62f9ae1e401b8.jpg'}, 
            {n:'Mouth', i:'https://i.pinimg.com/736x/52/04/de/5204decd2e6adf22ffe0c23a942f1ee3.jpg'},
            {n:'Nose', i:'https://i.pinimg.com/736x/1c/0e/af/1c0eaf45db9881b9d3c4335df81133ca.jpg'},
            {n:'Tongue', i:'https://i.pinimg.com/736x/95/b4/b7/95b4b780019b7068dfe9e4ed55101b9b.jpg'},
            {n:'Lips', i:'https://i.pinimg.com/736x/ad/90/53/ad90535a4d235c37bed4efcab6e669e6.jpg'}

        ],
        professions: [
            {n:'Doctor', i:'https://i.pinimg.com/1200x/28/98/8f/28988f0e4c918a5bf709ececdd62b159.jpg'}, 
            {n:'Teacher', i:'https://i.pinimg.com/736x/7d/46/1f/7d461f99789497417279efc499653aac.jpg'}, 
            {n:'Engineer', i:'https://i.pinimg.com/736x/b8/b6/7d/b8b67d6b85b0b1633559b8c6a66bf664.jpg'}, 
            {n:'Chef', i:'https://i.pinimg.com/736x/18/1b/db/181bdbbed5f0dece2ace101087090bd6.jpg'}, 
            {n:'Pilot', i:'https://i.pinimg.com/1200x/55/c8/25/55c825a35bb9be4d256367f3523f4784.jpg'},
            {n:'Police', i:'https://i.pinimg.com/1200x/9f/11/70/9f1170a8d570b41da3869bd17b0063dc.jpg'},
            {n:'Firefighter', i:'https://i.pinimg.com/1200x/b7/02/01/b702013fbc30e1a5e0a05ea7cdf096c2.jpg'}
        ]   
    };

    let selectedWord = null;
    let score = 0;
    let matches = []; // Menyimpan pasangan yang benar: { wordId, imgId }
    const canvas = document.getElementById('lineCanvas');
    const ctx = canvas.getContext('2d');

    function initGame(theme) {
        document.getElementById('home-screen').style.display = 'none';
        document.getElementById('game-screen').style.display = 'flex';
        document.getElementById('win-message').style.display = 'none';

        document.getElementById('theme-title').innerText = theme.toUpperCase();
        document.getElementById('score-text').innerText = `Score: 0/5`;
        
        score = 0;
        matches = [];
        selectedWord = null;
        
        const stock = dataStock[theme] || dataStock['numbers'];
        let items = [...stock].sort(() => Math.random() - 0.5).slice(0, 5);

        renderColumn('words-column', items, true);
        renderColumn('images-column', items, false);
        
        // Pastikan canvas siap
        setTimeout(resizeCanvas, 100);
    }

    function renderColumn(id, items, isWord) {
        const col = document.getElementById(id);
        col.innerHTML = '';
        const displayItems = [...items].sort(() => Math.random() - 0.5);
        
        displayItems.forEach((item, index) => {
            const div = document.createElement('div');
            div.className = 'card';
            // Beri ID unik agar koordinat bisa dicari nanti
            div.id = (isWord ? 'w-' : 'i-') + item.n; 
            
            if(isWord) {
                div.innerText = item.n;
                div.onclick = () => selectWord(div, item.n);
            } else {
                div.innerHTML = `<img src="${item.i}" onerror="this.src='https://via.placeholder.com/80?text=${item.n}'">`;
                div.onclick = () => checkMatch(div, item.n);
            }
            col.appendChild(div);
        });
    }

    function selectWord(el, name) {
        if(el.classList.contains('correct')) return;
        document.querySelectorAll('#words-column .card').forEach(c => c.classList.remove('selected'));
        el.classList.add('selected');
        selectedWord = { el, name };
    }

    function checkMatch(imgEl, name) {
        if(!selectedWord || imgEl.classList.contains('correct')) return;

        if(selectedWord.name === name) {
            imgEl.classList.add('correct');
            selectedWord.el.classList.add('correct');
            selectedWord.el.classList.remove('selected');
            
            // Simpan pasangan ID-nya saja, jangan koordinat kaku
            matches.push({ wordId: 'w-'+name, imgId: 'i-'+name });
            
            score++;
            document.getElementById('score-text').innerText = `Score: ${score}/5`;
            drawAllLines();
            selectedWord = null;

            if(score === document.querySelectorAll('#words-column .card').length) {
                document.getElementById('win-message').style.display = 'block';
            }
        } else {
            // Garis merah sementara
            drawErrorLine(selectedWord.el.id, imgEl.id);
        }
    }

    function drawAllLines() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const wrapperRect = document.getElementById('game-wrapper').getBoundingClientRect();

        matches.forEach(m => {
            const wEl = document.getElementById(m.wordId).getBoundingClientRect();
            const iEl = document.getElementById(m.imgId).getBoundingClientRect();

            draw(
                wEl.right - wrapperRect.left, 
                wEl.top + (wEl.height/2) - wrapperRect.top,
                iEl.left - wrapperRect.left,
                iEl.top + (iEl.height/2) - wrapperRect.top,
                '#2ecc71'
            );
        });
    }

    function drawErrorLine(wId, iId) {
        const wrapperRect = document.getElementById('game-wrapper').getBoundingClientRect();
        const wEl = document.getElementById(wId).getBoundingClientRect();
        const iEl = document.getElementById(iId).getBoundingClientRect();

        const x1 = wEl.right - wrapperRect.left;
        const y1 = wEl.top + (wEl.height/2) - wrapperRect.top;
        const x2 = iEl.left - wrapperRect.left;
        const y2 = iEl.top + (iEl.height/2) - wrapperRect.top;

        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.strokeStyle = '#e74c3c';
        ctx.lineWidth = 3;
        ctx.setLineDash([5, 5]);
        ctx.stroke();

        setTimeout(drawAllLines, 500); // Hapus garis merah setelah 0.5 detik
    }

    function draw(x1, y1, x2, y2, color) {
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.strokeStyle = color;
        ctx.lineWidth = 5;
        ctx.lineCap = 'round';
        ctx.setLineDash([]);
        ctx.stroke();
    }

    function resizeCanvas() {
        const wrapper = document.getElementById('game-wrapper');
        canvas.width = wrapper.clientWidth;
        canvas.height = wrapper.clientHeight;
        drawAllLines(); // Gambar ulang garis di posisi baru
    }

    function goBack() {
        // Sembunyikan semua layar permainan dan modal
        document.getElementById('home-screen').style.display = 'flex';
        document.getElementById('game-screen').style.display = 'none';
        document.getElementById('win-message').style.display = 'none'; // Pastikan modal hilang
        
        // Bersihkan canvas agar tidak ada garis sisa di permainan berikutnya
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        matches = []; 
    }

    function toggleFullScreen() {
        if (!document.fullscreenElement) document.documentElement.requestFullscreen();
        else document.exitFullscreen();
        setTimeout(resizeCanvas, 500); // Tunggu animasi fullscreen selesai
    }

    window.addEventListener('resize', resizeCanvas);
    
    document.addEventListener('contextmenu', function(e) {
        e.preventDefault();
        });
</script>
</body>
</html>
