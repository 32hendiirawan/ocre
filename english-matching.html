<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover">
    <title>English Matching Game</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        brand: {
                            bg: '#0f172a',
                            card: '#1e293b',
                            primary: '#38bdf8',
                            success: '#22c55e',
                            danger: '#ef4444',
                        }
                    }
                }
            }
        }
    </script>
    <style>
        /* Mencegah scroll dan seleksi teks pada perangkat mobile */
        * {
            -webkit-tap-highlight-color: transparent;
            user-select: none;
            -webkit-user-select: none;
        }
        body, html {
            height: 100%;
            width: 100%;
            overflow: hidden;
            touch-action: manipulation;
        }
        .card-shadow {
            box-shadow: 0 4px 15px -3px rgba(0, 0, 0, 0.3), 0 2px 6px -2px rgba(0, 0, 0, 0.2);
        }
    </style>
</head>
<body class="bg-slate-900 text-slate-100 font-sans h-screen w-screen flex flex-col justify-between p-3 select-none">

    <!-- LOBBY / UTAMA -->
    <div id="home-screen" class="flex-1 flex flex-col justify-between items-center py-4 w-full max-w-md mx-auto">
        <div class="text-center mt-2">
            <span class="inline-block px-3 py-1 bg-sky-500/20 text-sky-400 font-semibold text-xs rounded-full uppercase tracking-wider mb-1">Interactive Kids Game</span>
            <h1 class="text-3xl font-black text-transparent bg-clip-text bg-gradient-to-r from-sky-400 to-indigo-400 tracking-tight">ENGLISH</h1>
            <h2 class="text-lg font-bold text-slate-300">Matching Fun</h2>
        </div>

        <div class="w-full my-auto">
            <p class="text-center text-slate-400 text-xs mb-3 font-medium">Pilih Kategori Permainan:</p>
            <div class="grid grid-cols-2 gap-3.5 w-full px-2">
                <button onclick="initGame('numbers')" class="bg-gradient-to-br from-indigo-500 to-purple-600 hover:from-indigo-600 hover:to-purple-700 active:scale-95 text-white font-bold py-3.5 px-3 rounded-2xl shadow-lg border border-indigo-400/30 flex items-center justify-center space-x-2 transition duration-150">
                    <span class="text-xl">🔢</span>
                    <span class="text-sm">Numbers</span>
                </button>
                <button onclick="initGame('colors')" class="bg-gradient-to-br from-pink-500 to-rose-600 hover:from-pink-600 hover:to-rose-700 active:scale-95 text-white font-bold py-3.5 px-3 rounded-2xl shadow-lg border border-pink-400/30 flex items-center justify-center space-x-2 transition duration-150">
                    <span class="text-xl">🎨</span>
                    <span class="text-sm">Colors</span>
                </button>
                <button onclick="initGame('animals')" class="bg-gradient-to-br from-amber-500 to-orange-600 hover:from-amber-600 hover:to-orange-700 active:scale-95 text-white font-bold py-3.5 px-3 rounded-2xl shadow-lg border border-amber-400/30 flex items-center justify-center space-x-2 transition duration-150">
                    <span class="text-xl">🦁</span>
                    <span class="text-sm">Animals</span>
                </button>
                <button onclick="initGame('fruits')" class="bg-gradient-to-br from-emerald-500 to-teal-600 hover:from-emerald-600 hover:to-teal-700 active:scale-95 text-white font-bold py-3.5 px-3 rounded-2xl shadow-lg border border-emerald-400/30 flex items-center justify-center space-x-2 transition duration-150">
                    <span class="text-xl">🍎</span>
                    <span class="text-sm">Fruits</span>
                </button>
                <button onclick="initGame('body')" class="bg-gradient-to-br from-cyan-500 to-blue-600 hover:from-cyan-600 hover:to-blue-700 active:scale-95 text-white font-bold py-3.5 px-3 rounded-2xl shadow-lg border border-cyan-400/30 flex items-center justify-center space-x-2 transition duration-150">
                    <span class="text-xl">👀</span>
                    <span class="text-sm">Body Parts</span>
                </button>
                <button onclick="initGame('professions')" class="bg-gradient-to-br from-violet-500 to-fuchsia-600 hover:from-violet-600 hover:to-fuchsia-700 active:scale-95 text-white font-bold py-3.5 px-3 rounded-2xl shadow-lg border border-violet-400/30 flex items-center justify-center space-x-2 transition duration-150">
                    <span class="text-xl">👨‍⚕️</span>
                    <span class="text-sm">Professions</span>
                </button>
            </div>
        </div>

        <button onclick="toggleFullScreen()" class="w-full max-w-xs py-2.5 px-4 bg-slate-800 hover:bg-slate-700 active:scale-95 border border-slate-700 rounded-xl text-slate-300 font-semibold text-xs flex items-center justify-center space-x-2 transition duration-150">
            <span>📺</span>
            <span>Layar Penuh (Fullscreen)</span>
        </button>
    </div>

    <!-- ARENA PERMAINAN -->
    <div id="game-screen" class="hidden flex-col h-full w-full max-w-md mx-auto justify-between">
        <!-- HEADER -->
        <div class="flex justify-between items-center bg-slate-800/80 backdrop-blur-md px-3 py-2 rounded-2xl border border-slate-700/60 mb-2">
            <button onclick="goBack()" class="bg-slate-700 hover:bg-slate-600 text-slate-200 text-xs font-bold py-2 px-3 rounded-xl active:scale-95 transition flex items-center space-x-1">
                <span>◀</span>
                <span>Kembali</span>
            </button>
            <h2 id="theme-title" class="font-extrabold text-sm tracking-wider text-sky-400 uppercase">THEME</h2>
            <div id="score-text" class="bg-sky-500/20 text-sky-300 font-black text-xs px-2.5 py-1.5 rounded-lg border border-sky-500/30">
                0/5
            </div>
        </div>

        <!-- AREA COUPLING & CANVAS -->
        <div class="game-wrapper relative flex-1 my-1 w-full overflow-y-auto" id="game-wrapper">
            <canvas id="lineCanvas" class="absolute inset-0 pointer-events-none z-10 w-full h-full"></canvas>
            
            <div class="grid grid-cols-2 gap-10 h-full relative z-20">
                <!-- Kolom Teks / Kata -->
                <div class="flex flex-col justify-between space-y-2 h-full" id="words-column"></div>
                <!-- Kolom Gambar -->
                <div class="flex flex-col justify-between space-y-2 h-full" id="images-column"></div>
            </div>
        </div>

        <!-- MODAL MENANG -->
        <div id="win-message" class="hidden fixed inset-0 z-50 bg-slate-950/80 backdrop-blur-sm flex items-center justify-center p-4">
            <div class="bg-slate-800 border border-slate-700 rounded-3xl p-6 text-center max-w-xs w-full shadow-2xl transform transition-all scale-100">
                <div class="text-5xl mb-2 animate-bounce">🎉</div>
                <h2 class="text-2xl font-black text-white mb-1">Luar Biasa!</h2>
                <p class="text-slate-400 text-xs mb-5">Kamu berhasil menyelesaikan semua pasangan dengan sempurna!</p>
                <button onclick="goBack()" class="w-full bg-gradient-to-r from-sky-500 to-indigo-600 text-white font-bold py-3 px-4 rounded-xl shadow-lg active:scale-95 transition">
                    Main Lagi 🔄
                </button>
            </div>
        </div>
    </div>

<script>
    const dataStock = {
        numbers: [
            {n:'One', i:'https://i.pinimg.com/736x/4f/52/f3/4f52f37ef487c0360189f58b228fd0b0.jpg'},
            {n:'Two', i:'https://i.pinimg.com/736x/24/f0/d1/24f0d1104857d05c1c57d66371449685.jpg'},
            {n:'Three', i:'https://i.pinimg.com/736x/ee/6f/c2/ee6fc2d51b9f7e622ea3aa3a55f157b4.jpg'},
            {n:'Four', i:'https://i.pinimg.com/736x/62/8c/b4/628cb495e0dfcf42b3470ed5f781d22a.jpg'},
            {n:'Five', i:'https://i.pinimg.com/736x/8b/7a/50/8b7a50ddfe2a7b7b0702f8a0f25725bb.jpg'},
            {n:'Six', i:'https://i.pinimg.com/736x/21/93/04/219304221089fc6427757be1524b0fe9.jpg'},
            {n:'Seven', i:'https://i.pinimg.com/736x/5f/b1/76/5fb17634dd00b4c9563cd51b8a16580e.jpg'},
            {n:'Eight', i:'https://i.pinimg.com/736x/bc/c0/bd/bcc0bd628d74227640ed6156035c01f9.jpg'},
            {n:'Nine', i:'https://i.pinimg.com/736x/83/d8/17/83d8174893d0671440f31bb38cfd32fe.jpg'},
            {n:'Ten', i:'https://i.pinimg.com/736x/18/6c/5d/186c5d75edda79995872883f2aeff423.jpg'}
        ],
        colors: [
            {n:'Red', i:'https://i.pinimg.com/1200x/34/03/52/3403520989710c6e1dbffceae18b4960.jpg'},
            {n:'Green', i:'https://i.pinimg.com/736x/e7/c5/95/e7c595548b4cf494472c67f53952d9a7.jpg'},
            {n:'Blue', i:'https://i.pinimg.com/1200x/54/8d/c7/548dc74e7ca78660949276fe976de222.jpg'},
            {n:'Yellow', i:'https://i.pinimg.com/1200x/73/46/95/734695b8cbe45485127784142a6374dc.jpg'},
            {n:'Orange', i:'https://i.pinimg.com/1200x/d0/be/26/d0be26e6d0cefff7e8794c546f541058.jpg'},
        ],
        animals: [
            {n:'Lion', i:'https://i.pinimg.com/736x/7a/e3/82/7ae3821d216b2e3b39ee9a0a8b465c8a.jpg'}, 
            {n:'Cat', i:'https://i.pinimg.com/736x/0b/4b/cd/0b4bcd0fb7a06abc263a33d2448bc6ce.jpg'}, 
            {n:'Mouse', i:'https://i.pinimg.com/1200x/bf/74/43/bf74430ec1ddae5fb4bfed3b4b2154c5.jpg'}, 
            {n:'Duck', i:'https://i.pinimg.com/1200x/30/c7/f6/30c7f69f30463cb29fb9d04d6e12a002.jpg'}, 
            {n:'Bird', i:'https://i.pinimg.com/736x/0c/e4/88/0ce488a950b62f7139bfbba4c09db8c7.jpg'},
            {n:'Elephant', i:'https://i.pinimg.com/736x/f6/0e/42/f60e42332dfe603f9b7bd038842865b6.jpg'},
            {n:'Giraffe', i:'https://i.pinimg.com/1200x/3b/56/64/3b5664032a75fe73d363b375dda48563.jpg'},
            {n:'Crocodile', i:'https://i.pinimg.com/1200x/ee/3c/1a/ee3c1a92f1b4ed3b40a4a8f10ad4e37b.jpg'},
        ],
        fruits: [
            {n:'Apple', i:'https://i.pinimg.com/736x/e0/3b/06/e03b06fb3ea1bd333a7a85f7951bb51b.jpg'}, 
            {n:'Grape', i:'https://i.pinimg.com/736x/9e/7b/23/9e7b239ebe3bc97d25ce09ee4859b6d5.jpg'}, 
            {n:'Mango', i:'https://i.pinimg.com/736x/23/82/c9/2382c9ca6e55b1c8e52d0eb587328139.jpg'}, 
            {n:'Cherry', i:'https://i.pinimg.com/736x/3e/44/18/3e441868a39d6ddac14560c603e93e0b.jpg'},
            {n:'Orange', i:'https://i.pinimg.com/736x/20/55/34/205534442c0f83146d4e4d42a0b8403e.jpg'},
            {n:'Star Fruit', i:'https://i.pinimg.com/736x/17/07/d1/1707d124bdd1f20bcc27d5ab117b1cd2.jpg'},
            {n:'Banana', i:'https://i.pinimg.com/736x/31/42/45/314245035f92581abe3472c06f4b2138.jpg'},
            {n:'Watermelon', i:'https://i.pinimg.com/1200x/98/b1/4c/98b14cea23665b28074dede70e964573.jpg'},
            {n:'Strawberry', i:'https://i.pinimg.com/736x/c6/9e/a3/c69ea30c5c6b698df5d429f19cb1fa78.jpg'},
            {n:'Pineapple', i:'https://i.pinimg.com/736x/53/b8/25/53b825a8686825cbf9245a73f2840005.jpg'}
        ],
        body: [
            {n:'Ear', i:'https://i.pinimg.com/736x/cc/22/52/cc2252fd83e01d8c00b5f89cdae68a28.jpg'}, 
            {n:'Hand', i:'https://i.pinimg.com/1200x/02/30/60/02306075833215b55e7dd514c377c90b.jpg'}, 
            {n:'Foot', i:'https://i.pinimg.com/736x/48/a0/1d/48a01d17ad43d68ab599cdf7c712295d.jpg'}, 
            {n:'Eye', i:'https://i.pinimg.com/736x/51/4d/fc/514dfcc69877227188e62f9ae1e401b8.jpg'}, 
            {n:'Mouth', i:'https://i.pinimg.com/736x/52/04/de/5204decd2e6adf22ffe0c23a942f1ee3.jpg'},
            {n:'Nose', i:'https://i.pinimg.com/736x/1c/0e/af/1c0eaf45db9881b9d3c4335df81133ca.jpg'},
            {n:'Tongue', i:'https://i.pinimg.com/736x/95/b4/b7/95b4b780019b7068dfe9e4ed55101b9b.jpg'},
            {n:'Lips', i:'https://i.pinimg.com/736x/ad/90/53/ad90535a4d235c37bed4efcab6e669e6.jpg'}
        ],
        professions: [
            {n:'Doctor', i:'https://i.pinimg.com/1200x/28/98/8f/28988f0e4c918a5bf709ececdd62b159.jpg'}, 
            {n:'Teacher', i:'https://i.pinimg.com/736x/7d/46/1f/7d461f99789497417279efc499653aac.jpg'}, 
            {n:'Engineer', i:'https://i.pinimg.com/736x/b8/b6/7d/b8b67d6b85b0b1633559b8c6a66bf664.jpg'}, 
            {n:'Chef', i:'https://i.pinimg.com/736x/18/1b/db/181bdbbed5f0dece2ace101087090bd6.jpg'}, 
            {n:'Pilot', i:'https://i.pinimg.com/1200x/55/c8/25/55c825a35bb9be4d256367f3523f4784.jpg'},
            {n:'Police', i:'https://i.pinimg.com/1200x/9f/11/70/9f1170a8d570b41da3869bd17b0063dc.jpg'},
            {n:'Firefighter', i:'https://i.pinimg.com/1200x/b7/02/01/b702013fbc30e1a5e0a05ea7cdf096c2.jpg'}
        ]   
    };

    let selectedWord = null;
    let score = 0;
    let matches = [];
    const canvas = document.getElementById('lineCanvas');
    const ctx = canvas.getContext('2d');

    function initGame(theme) {
        document.getElementById('home-screen').classList.add('hidden');
        document.getElementById('home-screen').classList.remove('flex');
        
        document.getElementById('game-screen').classList.remove('hidden');
        document.getElementById('game-screen').classList.add('flex');
        
        document.getElementById('win-message').classList.add('hidden');

        document.getElementById('theme-title').innerText = theme;
        document.getElementById('score-text').innerText = `0/5`;
        
        score = 0;
        matches = [];
        selectedWord = null;
        
        const stock = dataStock[theme] || dataStock['numbers'];
        let items = [...stock].sort(() => Math.random() - 0.5).slice(0, 5);

        renderColumn('words-column', items, true);
        renderColumn('images-column', items, false);
        
        setTimeout(resizeCanvas, 100);
    }

    function renderColumn(id, items, isWord) {
        const col = document.getElementById(id);
        col.innerHTML = '';
        const displayItems = [...items].sort(() => Math.random() - 0.5);
        
        displayItems.forEach((item) => {
            const div = document.createElement('div');
            div.id = (isWord ? 'w-' : 'i-') + item.n; 
            
            if(isWord) {
                div.className = 'card-item h-[100px] w-full bg-slate-800 border-2 border-slate-700/80 rounded-2xl flex items-center justify-center font-bold text-base text-slate-100 cursor-pointer active:scale-95 transition-all duration-150 p-3 text-center card-shadow';
                div.innerText = item.n;
                div.onclick = () => selectWord(div, item.n);
            } else {
                div.className = 'card-item h-[100px] w-full bg-slate-800 border-2 border-slate-700/80 rounded-2xl flex items-center justify-center cursor-pointer active:scale-95 transition-all duration-150 p-2 overflow-hidden card-shadow';
                div.innerHTML = `<img src="${item.i}" class="w-full h-full object-contain pointer-events-none rounded-xl" onerror="this.src='https://via.placeholder.com/150?text=${item.n}'">`;
                div.onclick = () => checkMatch(div, item.n);
            }
            col.appendChild(div);
        });
    }

    function selectWord(el, name) {
        if(el.classList.contains('correct')) return;
        
        document.querySelectorAll('#words-column .card-item').forEach(c => {
            if(!c.classList.contains('correct')) {
                c.className = 'card-item h-[100px] w-full bg-slate-800 border-2 border-slate-700/80 rounded-2xl flex items-center justify-center font-bold text-base text-slate-100 cursor-pointer active:scale-95 transition-all duration-150 p-3 text-center card-shadow';
            }
        });
        
        el.className = 'card-item h-[100px] w-full bg-sky-900/60 border-2 border-sky-400 text-sky-200 rounded-2xl flex items-center justify-center font-bold text-base cursor-pointer scale-[1.02] transition-all duration-150 p-3 text-center card-shadow';
        selectedWord = { el, name };
    }

    function checkMatch(imgEl, name) {
        if(!selectedWord || imgEl.classList.contains('correct')) return;

        if(selectedWord.name === name) {
            imgEl.className = 'card-item h-[100px] w-full bg-emerald-950/40 border-2 border-emerald-500 rounded-2xl flex items-center justify-center cursor-default p-2 overflow-hidden opacity-80 card-shadow';
            selectedWord.el.className = 'card-item h-[100px] w-full bg-emerald-950/40 border-2 border-emerald-500 text-emerald-300 rounded-2xl flex items-center justify-center font-bold text-base cursor-default p-3 text-center opacity-80 card-shadow';
            
            selectedWord.el.classList.add('correct');
            imgEl.classList.add('correct');

            matches.push({ wordId: 'w-'+name, imgId: 'i-'+name });
            
            score++;
            document.getElementById('score-text').innerText = `${score}/5`;
            drawAllLines();
            selectedWord = null;

            if(score === document.querySelectorAll('#words-column .card-item').length) {
                setTimeout(() => {
                    document.getElementById('win-message').classList.remove('hidden');
                }, 300);
            }
        } else {
            drawErrorLine(selectedWord.el.id, imgEl.id);
        }
    }

    function drawAllLines() {
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        const wrapperRect = document.getElementById('game-wrapper').getBoundingClientRect();

        matches.forEach(m => {
            const wEl = document.getElementById(m.wordId).getBoundingClientRect();
            const iEl = document.getElementById(m.imgId).getBoundingClientRect();

            draw(
                wEl.right - wrapperRect.left, 
                wEl.top + (wEl.height/2) - wrapperRect.top,
                iEl.left - wrapperRect.left,
                iEl.top + (iEl.height/2) - wrapperRect.top,
                '#10b981'
            );
        });
    }

    function drawErrorLine(wId, iId) {
        const wrapperRect = document.getElementById('game-wrapper').getBoundingClientRect();
        const wEl = document.getElementById(wId).getBoundingClientRect();
        const iEl = document.getElementById(iId).getBoundingClientRect();

        const x1 = wEl.right - wrapperRect.left;
        const y1 = wEl.top + (wEl.height/2) - wrapperRect.top;
        const x2 = iEl.left - wrapperRect.left;
        const y2 = iEl.top + (iEl.height/2) - wrapperRect.top;

        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.strokeStyle = '#ef4444';
        ctx.lineWidth = 4;
        ctx.setLineDash([6, 6]);
        ctx.stroke();

        setTimeout(drawAllLines, 400);
    }

    function draw(x1, y1, x2, y2, color) {
        ctx.beginPath();
        ctx.moveTo(x1, y1);
        ctx.lineTo(x2, y2);
        ctx.strokeStyle = color;
        ctx.lineWidth = 5;
        ctx.lineCap = 'round';
        ctx.setLineDash([]);
        ctx.stroke();
    }

    function resizeCanvas() {
        const wrapper = document.getElementById('game-wrapper');
        canvas.width = wrapper.clientWidth;
        canvas.height = wrapper.clientHeight;
        drawAllLines();
    }

    function goBack() {
        document.getElementById('home-screen').classList.remove('hidden');
        document.getElementById('home-screen').classList.add('flex');
        
        document.getElementById('game-screen').classList.add('hidden');
        document.getElementById('game-screen').classList.remove('flex');
        document.getElementById('win-message').classList.add('hidden');
        
        ctx.clearRect(0, 0, canvas.width, canvas.height);
        matches = []; 
    }

    function toggleFullScreen() {
        if (!document.fullscreenElement) {
            document.documentElement.requestFullscreen().catch(() => {});
        } else {
            document.exitFullscreen().catch(() => {});
        }
        setTimeout(resizeCanvas, 300);
    }

    window.addEventListener('resize', resizeCanvas);
    document.addEventListener('contextmenu', e => e.preventDefault());

    (function() {
        window.addEventListener('contextmenu', e => { e.preventDefault(); e.stopPropagation(); }, true);
        window.addEventListener('keydown', function(e) {
            if (e.key === 'F12') { e.preventDefault(); e.stopPropagation(); }
            if (e.ctrlKey && e.shiftKey && ['I', 'J', 'C'].includes(e.key.toUpperCase())) { e.preventDefault(); e.stopPropagation(); }
            if (e.ctrlKey && ['U', 'S', 'A', 'C'].includes(e.key.toUpperCase())) { e.preventDefault(); e.stopPropagation(); }
        }, true);
    })();
</script>
</body>
</html>
